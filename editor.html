<!DOCTYPE html> 
<html lang="es"> 
<head> 
    <meta charset="UTF-8"> 
    <meta name="viewport" content="width=device-width, initial-scale=1.0"> 
    <title>Parámetros Emisor - Editor V5</title> 
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script> 
    <style> 
        :root { 
            --naranja: #ff650d; 
            --gris: #595959; 
            --gris-claro: #f2f2f2; 
            --borde: #d2d2d2; 
            --rojo: #b42318; 
            --verde: #217346; 
        } 
 
        * { 
            box-sizing: border-box; 
        } 
 
        body { 
            margin: 0; 
            background: var(--gris-claro); 
            color: #383838; 
            font-family: "Segoe UI", Arial, sans-serif; 
        } 
 
        button, 
        input, 
        textarea, 
        select { 
            font: inherit; 
        } 
 
        button { 
            cursor: pointer; 
        } 
 
        .encabezado { 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            gap: 12px; 
            flex-wrap: wrap; 
            padding: 10px 20px; 
            background: white; 
            border-bottom: 1px solid var(--borde); 
        } 
 
        .encabezado h1 { 
            margin: 0; 
            color: var(--naranja); 
            font-size: 34px; 
            font-weight: 300; 
        } 
 
        .acciones-principales, 
        .pestanas { 
            display: flex; 
            gap: 8px; 
            flex-wrap: wrap; 
        } 
 
        .boton { 
            padding: 9px 13px; 
            border: 0; 
            border-radius: 8px; 
            background: var(--gris); 
            color: white; 
            font-weight: 700; 
        } 
 
        .boton-naranja { 
            background: var(--naranja); 
        } 
 
        .boton-rojo { 
            background: var(--rojo); 
        } 
 
        .boton-verde { 
            background: var(--verde); 
        } 
 
        .boton:disabled { 
            opacity: 0.45; 
            cursor: not-allowed; 
        } 
 
        .pestanas { 
            padding: 10px 20px; 
            background: white; 
            border-bottom: 1px solid var(--borde); 
        } 
 
        .pestana { 
            padding: 9px 22px; 
            border: 1px solid var(--borde); 
            border-radius: 999px; 
            background: white; 
            color: var(--gris); 
            font-weight: 800; 
        } 
 
        .pestana.activa { 
            border-color: var(--gris); 
            background: var(--gris); 
            color: white; 
        } 
 
        .menu-opciones { 
            display: grid; 
            grid-template-columns: repeat(10, minmax(0, 1fr)); 
            gap: 5px; 
            padding: 8px 20px; 
            background: #fafafa; 
            border-bottom: 1px solid var(--borde); 
        } 
 
        .boton-opcion { 
            min-width: 0; 
            height: 28px; 
            padding: 3px 6px; 
            overflow: hidden; 
            border: 1px solid var(--borde); 
            border-radius: 15px; 
            background: white; 
            color: #3f3f3f; 
            font-size: 11px; 
            font-weight: 750; 
            text-overflow: ellipsis; 
            white-space: nowrap; 
        } 
 
        .boton-opcion.activa { 
            border-color: var(--naranja); 
            background: var(--naranja); 
            color: white; 
        } 
 
        .barra-herramientas { 
            display: flex; 
            align-items: center; 
            gap: 8px; 
            flex-wrap: wrap; 
            padding: 10px 20px; 
            background: white; 
            border-bottom: 1px solid var(--borde); 
        } 
 
        .indicador-cambios { 
            margin-left: auto; 
            color: #666; 
            font-size: 13px; 
        } 
 
        .indicador-cambios.pendiente { 
            color: #a15d00; 
            font-weight: 800; 
        } 
 
        .filtros { 
            display: grid; 
            grid-template-columns: 2fr repeat(3, 1fr) auto; 
            gap: 8px; 
            padding: 12px 20px; 
        } 
 
        input, 
        textarea, 
        select { 
            width: 100%; 
            padding: 9px; 
            border: 1px solid var(--borde); 
            border-radius: 7px; 
            background: white; 
        } 
 
        textarea { 
            min-height: 88px; 
            resize: vertical; 
        } 
 
        .estado, 
        .titulo-opcion { 
            padding: 6px 20px; 
        } 
 
        .estado { 
            color: #666; 
            font-size: 13px; 
        } 
 
        .estado.error { 
            color: var(--rojo); 
        } 
 
        .titulo-opcion { 
            margin: 0; 
            color: #444; 
            font-size: 25px; 
            font-weight: 400; 
        } 
 
        .contenido { 
            padding: 10px 20px 70px; 
        } 
 
        .ficha { 
            margin-bottom: 14px; 
            background: white; 
            border: 1px solid var(--borde); 
            box-shadow: 0 2px 7px #00000012; 
        } 
 
        .ficha-encabezado { 
            display: grid; 
            grid-template-columns: 150px minmax(0, 1fr) auto; 
            border-bottom: 1px solid var(--borde); 
        } 
 
        .codigo-opcion { 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            padding: 10px; 
            background: var(--gris); 
            color: white; 
            font-weight: 800; 
        } 
 
        .nombre-parametro { 
            padding: 10px 15px; 
            color: var(--naranja); 
            font-size: 24px; 
            font-weight: 300; 
        } 
 
        .acciones-ficha { 
            display: flex; 
            align-items: center; 
            gap: 5px; 
            flex-wrap: wrap; 
            padding: 7px; 
        } 
 
        .acciones-ficha .boton { 
            padding: 6px 8px; 
            font-size: 11px; 
        } 
 
        .cuadricula-ficha { 
            display: grid; 
            grid-template-columns: repeat(3, minmax(0, 1fr)); 
            gap: 9px; 
            padding: 11px; 
        } 
 
        .campo-ficha { 
            min-height: 96px; 
            padding: 10px; 
            background: #fafafa; 
            border: 1px solid #e2e2e2; 
            border-top: 4px solid #b8b8b8; 
        } 
 
        .campo-ficha.ejemplo { 
            background: #fff5eb; 
        } 
 
        .etiqueta { 
            margin-bottom: 7px; 
            color: #444; 
            font-size: 11px; 
            font-weight: 850; 
            text-transform: uppercase; 
        } 
 
        .valor { 
            line-height: 1.38; 
            white-space: pre-wrap; 
        } 
 
        .enlace-dependencia { 
            color: #0b57a4; 
            font-weight: 700; 
            text-decoration: underline; 
            cursor: pointer; 
        } 
 
        .sin-resultados { 
            padding: 25px; 
            background: white; 
            border: 1px dashed var(--borde); 
            border-radius: 9px; 
            color: #666; 
            text-align: center; 
        } 
 
        .emergente { 
            position: fixed; 
            inset: 0; 
            z-index: 100; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            padding: 16px; 
            background: #0009; 
        } 
 
        .emergente[hidden] { 
            display: none; 
        } 
 
        .ventana { 
            width: min(920px, 100%); 
            max-height: 94vh; 
            overflow: auto; 
            padding: 18px; 
            border-radius: 13px; 
            background: white; 
        } 
 
        .ventana-pequena { 
            width: min(680px, 100%); 
        } 
 
        .ventana-encabezado { 
            display: flex; 
            align-items: center; 
            justify-content: space-between; 
            gap: 10px; 
        } 
 
        .ventana-encabezado h2 { 
            margin: 0; 
            color: var(--naranja); 
            font-weight: 400; 
        } 
 
        .formulario { 
            display: grid; 
            grid-template-columns: 1fr 1fr; 
            gap: 11px; 
            margin-top: 12px; 
        } 
 
        .formulario label { 
            color: #444; 
            font-size: 12px; 
            font-weight: 800; 
        } 
 
        .ancho-completo, 
        .acciones-formulario { 
            grid-column: 1 / -1; 
        } 
 
        .acciones-formulario { 
            display: flex; 
            justify-content: flex-end; 
            gap: 8px; 
        } 
 
        .ayuda-dependencia { 
            margin: 4px 0 0; 
            color: #666; 
            font-size: 11px; 
        } 
 
        .lista-dependencias { 
            display: grid; 
            gap: 7px; 
            max-height: 360px; 
            overflow: auto; 
            margin-top: 10px; 
        } 
 
        .resultado-dependencia { 
            padding: 9px; 
            border: 1px solid var(--borde); 
            border-radius: 7px; 
            background: white; 
            text-align: left; 
        } 
 
        .toast { 
            position: fixed; 
            right: 18px; 
            bottom: 18px; 
            z-index: 150; 
            max-width: 430px; 
            padding: 12px 15px; 
            border-radius: 9px; 
            background: #222; 
            color: white; 
        } 
 
        .toast.error { 
            background: var(--rojo); 
        } 
 
        [hidden] { 
            display: none !important; 
        } 
 
        @media (max-width: 1050px) { 
            .menu-opciones { 
                grid-template-columns: repeat(8, minmax(0, 1fr)); 
            } 
 
            .cuadricula-ficha { 
                grid-template-columns: repeat(2, minmax(0, 1fr)); 
            } 
        } 
 
        @media (max-width: 760px) { 
            .menu-opciones { 
                grid-template-columns: repeat(4, minmax(0, 1fr)); 
            } 
 
            .filtros, 
            .formulario, 
            .cuadricula-ficha { 
                grid-template-columns: 1fr; 
            } 
 
            .ancho-completo, 
            .acciones-formulario { 
                grid-column: auto; 
            } 
 
            .ficha-encabezado { 
                grid-template-columns: 95px minmax(0, 1fr); 
            } 
 
            .acciones-ficha { 
                grid-column: 1 / -1; 
            } 
 
            .indicador-cambios { 
                width: 100%; 
                margin-left: 0; 
            } 
        } 
    </style> 
</head> 
<body> 
    <header class="encabezado"> 
        <h1>Parámetros del Emisor</h1> 
        <div class="acciones-principales"> 
            <button class="boton boton-naranja" onclick="abrirNuevoRegistro()">Nuevo registro</button> 
            <button class="boton" onclick="seleccionarJSON()">Importar JSON</button> 
            <button class="boton" onclick="seleccionarExcel()">Importar Excel</button> 
            <button class="boton boton-naranja" onclick="exportarJSON()">Exportar JSON</button> 
            <button class="boton" onclick="exportarWord()">Exportar Word B/N</button> 
        </div> 
    </header> 
 
    <section class="pestanas"> 
        <button id="btnExterno" class="pestana activa" onclick="cambiarAmbito('externo')">Externo</button> 
        <button id="btnInterno" class="pestana" onclick="cambiarAmbito('interno')">Interno</button> 
    </section> 
 
    <nav id="menuOpciones" class="menu-opciones"></nav> 
 
    <section class="barra-herramientas"> 
        <button id="btnDescartar" class="boton boton-rojo" onclick="descartarCambios()" disabled> 
            Descartar cambios 
        </button> 
        <span id="indicadorCambios" class="indicador-cambios">Sin cambios pendientes</span> 
    </section> 
 
    <section class="filtros"> 
        <input id="busquedaGeneral" type="search" placeholder="Buscar por palabra clave en TODAS las opciones"> 
        <input id="filtroNombre" type="search" placeholder="Filtrar nombre del parámetro"> 
        <input id="filtroProducto" type="search" placeholder="Filtrar producto"> 
        <input id="filtroPais" type="search" placeholder="Filtrar país"> 
        <button class="boton" onclick="limpiarFiltros()">Limpiar todos los filtros</button> 
    </section> 
 
    <div id="estado" class="estado">Cargando información...</div> 
    <h2 id="tituloOpcion" class="titulo-opcion"></h2> 
    <main id="contenido" class="contenido"></main> 
 
    <input id="archivoJSON" type="file" accept=".json,application/json" hidden> 
    <input id="archivoExcel" type="file" accept=".xlsx,.xls" hidden> 
 
    <div id="emergenteRegistro" class="emergente" hidden> 
        <section class="ventana"> 
            <div class="ventana-encabezado"> 
                <h2 id="tituloFormulario">Nuevo registro</h2> 
                <button class="boton" onclick="cerrarFormulario()">Cerrar</button> 
            </div> 
 
            <form id="formulario" class="formulario"> 
                <input id="indiceEdicion" type="hidden" value="-1"> 
                <input id="opcionEdicion" type="hidden"> 
 
                <label> 
                    Opción 
                    <select id="codigo" required></select> 
                </label> 
 
                <label> 
                    Nombre del Parámetro 
                    <input id="nombre" required> 
                </label> 
 
                <label> 
                    Producto 
                    <input id="producto"> 
                </label> 
 
                <label> 
                    País 
                    <input id="pais"> 
                </label> 
 
                <label class="ancho-completo"> 
                    Valores Permitidos 
                    <textarea id="valores"></textarea> 
                </label> 
 
                <label class="ancho-completo"> 
                    ¿Qué hace el parámetro? 
                    <textarea id="que"></textarea> 
                </label> 
 
                <label class="ancho-completo"> 
                    ¿Cómo funciona? 
                    <textarea id="como"></textarea> 
                </label> 
 
                <label class="ancho-completo"> 
                    Dependencias / Reglas 
                    <textarea id="dependencias"></textarea> 
                    <p class="ayuda-dependencia"> 
                        Seleccione texto y pulse clic derecho para vincular otro parámetro. 
                    </p> 
                </label> 
 
                <label class="ancho-completo"> 
                    ¿Cuándo aplica? 
                    <textarea id="cuando"></textarea> 
                </label> 
 
                <label class="ancho-completo"> 
                    Ejemplo Funcional 
                    <textarea id="ejemplo"></textarea> 
                </label> 
 
                <label class="ancho-completo"> 
                    Notas Visibles al Cliente 
                    <textarea id="notas"></textarea> 
                </label> 
 
                <div class="acciones-formulario"> 
                    <button type="button" class="boton" onclick="cerrarFormulario()">Cancelar</button> 
                    <button class="boton boton-naranja">Guardar en borrador</button> 
                </div> 
            </form> 
        </section> 
    </div> 
 
    <div id="emergenteDependencia" class="emergente" hidden> 
        <section class="ventana ventana-pequena"> 
            <div class="ventana-encabezado"> 
                <h2>Vincular dependencia</h2> 
                <button class="boton" onclick="cerrarDependencias()">Cerrar</button> 
            </div> 
            <input id="buscarDependencia" type="search" placeholder="Buscar parámetro relacionado"> 
            <div id="listaDependencias" class="lista-dependencias"></div> 
        </section> 
    </div> 
 
    <div id="toast" class="toast" hidden></div> 
 
    <script> 
        "use strict"; 
 
        const OPCIONES = [ 
            ["05", "Consultar"], 
            ["12", "Trabajar con"], 
            ["13", "Moneda"], 
            ["14", "Clasificación"], 
            ["15", "Membresías"], 
            ["16", "Cargos Auto"], 
            ["17", "Ciclos"], 
            ["18", "Tipo Cliente"], 
            ["19", "Renovación"], 
            ["20", "Pólizas"], 
            ["21", "Mensajes"], 
            ["22", "Sorteos"], 
            ["23", "Estados"], 
            ["24", "Clases"], 
            ["25", "Trasiego"], 
            ["26", "Cargos I.V."], 
            ["27", "Corporativo"], 
            ["28", "Skip Pay"], 
            ["29", "Diseño"], 
            ["30", "Extrafin."], 
            ["31", "Limpiar"], 
            ["32", "Tipo Cta."], 
            ["33", "Costos"], 
            ["34", "Estados Cta."], 
            ["35", "Excepciones"], 
            ["36", "Origen"], 
            ["38", "No Intereses"], 
            ["39", "Excep."], 
            ["40", "Documentos"], 
            ["42", "Prepago"], 
            ["44", "Reducc."], 
            ["45", "Vence Pago"], 
            ["46", "Copia"], 
            ["47", "Deterioro"], 
            ["48", "Prospecto"], 
            ["49", "Renov. Tarj."], 
            ["50", "Renov. Emisor"], 
            ["52", "Rangos"], 
            ["53", "Tecnología"] 
        ]; 
 
        const CAMPOS = [ 
            "codigo", 
            "nombre", 
            "producto", 
            "pais", 
            "valores", 
            "que", 
            "como", 
            "dependencias", 
            "cuando", 
            "ejemplo", 
            "notas" 
        ]; 
 
        const SINONIMOS_EXCEL = { 
            nombre: ["nombre del parametro", "nombre parametro", "parametro"], 
            producto: ["producto"], 
            pais: ["pais"], 
            valores: ["valores permitidos", "valor permitido"], 
            que: ["que hace el parametro", "que hace"], 
            como: ["como funciona"], 
            dependencias: ["dependencias reglas", "dependencias", "reglas"], 
            cuando: ["cuando aplica"], 
            ejemplo: ["ejemplo funcional", "ejemplo"], 
            notas: ["notas visibles al cliente", "notas"] 
        }; 
 
        const $ = id => document.getElementById(id); 
 
        let ambitoActual = "externo"; 
        let opcionActual = "05"; 
        let datosPorOpcion = {}; 
        let originalesPorOpcion = {}; 
        let opcionesCargadas = false; 
        let cambios = { creados: 0, editados: 0, eliminados: 0 }; 
        let seleccionDependencia = null; 
 
        function escapar(valor) { 
            return String(valor ?? "") 
                .replaceAll("&", "&amp;") 
                .replaceAll("<", "&lt;") 
                .replaceAll(">", "&gt;") 
                .replaceAll('"', "&quot;") 
                .replaceAll("'", "&#039;"); 
        } 
 
        function normalizar(valor) { 
            return String(valor ?? "") 
                .toLowerCase() 
                .normalize("NFD") 
                .replace(/[\u0300-\u036f]/g, "") 
                .replace(/[^a-z0-9]+/g, " ") 
                .replace(/\s+/g, " ") 
                .trim(); 
        } 
 
        function nombreOpcion(codigo) { 
            return OPCIONES.find(opcion => opcion[0] === codigo)?.[1] || "Sin nombre"; 
        } 
 
        function rutaOpcion(codigo) { 
            return `data/${ambitoActual}/op${codigo}.json`; 
        } 
 
        function todosLosRegistros() { 
            return OPCIONES.flatMap(([codigo]) => 
                (datosPorOpcion[codigo] || []).map(registro => ({ 
                    ...registro, 
                    __opcion: codigo 
                })) 
            ); 
        } 
 
        function hayCambios() { 
            return cambios.creados + cambios.editados + cambios.eliminados > 0; 
        } 
 
        function registrarCambio(tipo) { 
            cambios[tipo] += 1; 
            actualizarIndicadorCambios(); 
        } 
 
        function reiniciarCambios() { 
            cambios = { creados: 0, editados: 0, eliminados: 0 }; 
            actualizarIndicadorCambios(); 
        } 
 
        function actualizarIndicadorCambios() { 
            const total = cambios.creados + cambios.editados + cambios.eliminados; 
            const indicador = $("indicadorCambios"); 
 
            indicador.textContent = total 
                ? `Cambios pendientes: ${cambios.creados} creados, ${cambios.editados} editados, ${cambios.eliminados} eliminados` 
                : "Sin cambios pendientes"; 
 
            indicador.classList.toggle("pendiente", total > 0); 
            $("btnDescartar").disabled = total === 0; 
        } 
 
        function mostrarToast(mensaje, error = false) { 
            const toast = $("toast"); 
            toast.textContent = mensaje; 
            toast.className = "toast" + (error ? " error" : ""); 
            toast.hidden = false; 
 
            clearTimeout(mostrarToast.temporizador); 
            mostrarToast.temporizador = setTimeout(() => { 
                toast.hidden = true; 
            }, 3600); 
        } 
 
        function construirMenu() { 
            $("menuOpciones").innerHTML = ` 
                <button 
                    class="boton-opcion ${opcionActual === "todas" ? "activa" : ""}" 
                    onclick="cambiarOpcion('todas')"> 
                    Todas 
                </button> 
            ` + OPCIONES.map(([codigo, nombre]) => ` 
                <button 
                    class="boton-opcion ${opcionActual === codigo ? "activa" : ""}" 
                    title="Op. ${codigo} · ${escapar(nombre)}" 
                    onclick="cambiarOpcion('${codigo}')"> 
                    Op. ${codigo} · ${escapar(nombre)} 
                </button> 
            `).join(""); 
        } 
 
        function confirmarPerdidaCambios() { 
            if (!hayCambios()) { 
                return true; 
            } 
 
            return confirm("Hay cambios sin exportar. ¿Descartarlos y continuar?"); 
        } 
 
        async function cambiarAmbito(nuevoAmbito) { 
            if (!confirmarPerdidaCambios()) { 
                return; 
            } 
 
            ambitoActual = nuevoAmbito; 
            $("btnExterno").classList.toggle("activa", nuevoAmbito === "externo"); 
            $("btnInterno").classList.toggle("activa", nuevoAmbito === "interno"); 
            await cargarTodasLasOpciones(); 
        } 
 
        function cambiarOpcion(nuevaOpcion) { 
            opcionActual = nuevaOpcion; 
            construirMenu(); 
            aplicarFiltros(); 
        } 
 
        async function leerOpcion(codigo) { 
            try { 
                const respuesta = await fetch( 
                    `./${rutaOpcion(codigo)}?v=${Date.now()}`, 
                    { cache: "no-store" } 
                ); 
 
                if (respuesta.status === 404) { 
                    return []; 
                } 
 
                if (!respuesta.ok) { 
                    throw new Error(`${rutaOpcion(codigo)} (${respuesta.status})`); 
                } 
 
                const datos = await respuesta.json(); 
 
                if (!Array.isArray(datos)) { 
                    throw new Error(`${rutaOpcion(codigo)} no contiene una lista JSON.`); 
                } 
 
                return datos; 
            } catch (error) { 
                console.warn(error); 
                return []; 
            } 
        } 
 
        async function cargarTodasLasOpciones() { 
            $("estado").className = "estado"; 
            $("estado").textContent = "Cargando todas las opciones para habilitar la búsqueda global..."; 
 
            const resultados = await Promise.all( 
                OPCIONES.map(async ([codigo]) => [codigo, await leerOpcion(codigo)]) 
            ); 
 
            datosPorOpcion = Object.fromEntries(resultados); 
            originalesPorOpcion = structuredClone(datosPorOpcion); 
            opcionesCargadas = true; 
            reiniciarCambios(); 
            construirMenu(); 
            aplicarFiltros(); 
        } 
 
        function registrosParaVista() { 
            const palabra = normalizar($("busquedaGeneral").value); 
            const nombre = normalizar($("filtroNombre").value); 
            const producto = normalizar($("filtroProducto").value); 
            const pais = normalizar($("filtroPais").value); 
 
            let base; 
 
            if (palabra || opcionActual === "todas") { 
                base = todosLosRegistros(); 
            } else { 
                base = (datosPorOpcion[opcionActual] || []).map(registro => ({ 
                    ...registro, 
                    __opcion: opcionActual 
                })); 
            } 
 
            return base.filter(registro => { 
                const textoGeneral = normalizar( 
                    CAMPOS.map(campo => registro[campo] ?? "").join(" ") 
                ); 
 
                return ( 
                    (!palabra || textoGeneral.includes(palabra)) && 
                    (!nombre || normalizar(registro.nombre).includes(nombre)) && 
                    (!producto || normalizar(registro.producto).includes(producto)) && 
                    (!pais || normalizar(registro.pais).includes(pais)) 
                ); 
            }); 
        } 
 
        function aplicarFiltros() { 
            const registros = registrosParaVista(); 
            const busquedaGlobalActiva = Boolean(normalizar($("busquedaGeneral").value)); 
 
            if (busquedaGlobalActiva) { 
                $("tituloOpcion").textContent = "Resultados en todas las opciones"; 
            } else if (opcionActual === "todas") { 
                $("tituloOpcion").textContent = "Todas las opciones"; 
            } else { 
                $("tituloOpcion").textContent = `Opción ${opcionActual} ${nombreOpcion(opcionActual)}`; 
            } 
 
            $("estado").textContent = `${ambitoActual === "externo" ? "Externo" : "Interno"}: mostrando ${registros.length} registro(s).`; 
            renderizar(registros); 
        } 
 
        function limpiarFiltros() { 
            ["busquedaGeneral", "filtroNombre", "filtroProducto", "filtroPais"].forEach(id => { 
                $(id).value = ""; 
            }); 
            aplicarFiltros(); 
        } 
 
        function renderizarDependencias(texto) { 
            const seguro = escapar(texto || "—"); 
 
            return seguro.replace( 
                /\[\[([^|\]]+)\|([^\]]+)\]\]/g, 
                (_, id, etiqueta) => `<span class="enlace-dependencia" title="${escapar(id)}" onclick="abrirDependencia('${escapar(id)}')">${escapar(etiqueta)}</span>` 
            ); 
        } 
 
        function campoFicha(etiqueta, valor, clase = "", esDependencia = false) { 
            return ` 
                <div class="campo-ficha ${clase}"> 
                    <div class="etiqueta">${escapar(etiqueta)}</div> 
                    <div class="valor">${esDependencia ? renderizarDependencias(valor) : escapar(valor || "—")}</div> 
                </div> 
            `; 
        } 
 
        function renderizar(registros) { 
            const contenido = $("contenido"); 
 
            if (!registros.length) { 
                contenido.innerHTML = `<div class="sin-resultados">No hay registros para mostrar.</div>`; 
                return; 
            } 
 
            contenido.innerHTML = registros.map(registroVista => { 
                const codigo = registroVista.__opcion; 
                const lista = datosPorOpcion[codigo] || []; 
                const indice = lista.findIndex(registro => 
                    registro === registroVista || 
                    (registro.id && registro.id === registroVista.id) || 
                    ( 
                        registro.nombre === registroVista.nombre && 
                        registro.producto === registroVista.producto && 
                        registro.pais === registroVista.pais 
                    ) 
                ); 
 
                return ` 
                    <article class="ficha"> 
                        <div class="ficha-encabezado"> 
                            <div class="codigo-opcion">Op. ${codigo}</div> 
                            <div class="nombre-parametro">${escapar(registroVista.nombre || "Sin nombre")}</div> 
                            <div class="acciones-ficha"> 
                                <button class="boton" onclick="editarRegistro('${codigo}', ${indice})">Editar</button> 
                                <button class="boton" onclick="duplicarRegistro('${codigo}', ${indice})">Duplicar</button> 
                                <button class="boton" onclick="moverRegistro('${codigo}', ${indice}, -1)">↑</button> 
                                <button class="boton" onclick="moverRegistro('${codigo}', ${indice}, 1)">↓</button> 
                                <button class="boton boton-rojo" onclick="eliminarRegistro('${codigo}', ${indice})">Eliminar</button> 
                            </div> 
                        </div> 
                        <div class="cuadricula-ficha"> 
                            ${campoFicha("Producto", registroVista.producto)} 
                            ${campoFicha("País", registroVista.pais)} 
                            ${campoFicha("Valores Permitidos", registroVista.valores)} 
                            ${campoFicha("¿Qué hace?", registroVista.que || registroVista.descripcion)} 
                            ${campoFicha("¿Cómo funciona?", registroVista.como)} 
                            ${campoFicha("Dependencias / Reglas", registroVista.dependencias || registroVista.dep, "", true)} 
                            ${campoFicha("¿Cuándo aplica?", registroVista.cuando)} 
                            ${campoFicha("Ejemplo Funcional", registroVista.ejemplo, "ejemplo")} 
                            ${campoFicha("Notas Visibles al Cliente", registroVista.notas)} 
                        </div> 
                    </article> 
                `; 
            }).join(""); 
        } 
 
        function llenarSelectorOpciones(codigoSeleccionado) { 
            $("codigo").innerHTML = OPCIONES.map(([codigo, nombre]) => ` 
                <option value="${codigo}" ${codigo === codigoSeleccionado ? "selected" : ""}> 
                    Op. ${codigo} · ${escapar(nombre)} 
                </option> 
            `).join(""); 
        } 
 
        function abrirNuevoRegistro() { 
            const codigo = opcionActual === "todas" ? "05" : opcionActual; 
 
            $("formulario").reset(); 
            $("indiceEdicion").value = "-1"; 
            $("opcionEdicion").value = codigo; 
            llenarSelectorOpciones(codigo); 
            $("tituloFormulario").textContent = "Nuevo registro"; 
            $("emergenteRegistro").hidden = false; 
            $("nombre").focus(); 
        } 
 
        function editarRegistro(codigo, indice) { 
            const registro = datosPorOpcion[codigo]?.[indice]; 
 
            if (!registro) { 
                mostrarToast("No fue posible localizar el registro.", true); 
                return; 
            } 
 
            $("formulario").reset(); 
            $("indiceEdicion").value = String(indice); 
            $("opcionEdicion").value = codigo; 
            llenarSelectorOpciones(codigo); 
 
            CAMPOS.filter(campo => campo !== "codigo").forEach(campo => { 
                const anterior = campo === "dependencias" ? registro.dep : undefined; 
                $(campo).value = registro[campo] ?? anterior ?? ""; 
            }); 
 
            $("tituloFormulario").textContent = "Editar registro"; 
            $("emergenteRegistro").hidden = false; 
        } 
 
        function cerrarFormulario() { 
            $("emergenteRegistro").hidden = true; 
        } 
 
        $("formulario").addEventListener("submit", evento => { 
            evento.preventDefault(); 
 
            const indice = Number($("indiceEdicion").value); 
            const opcionOriginal = $("opcionEdicion").value; 
            const opcionDestino = $("codigo").value; 
            const listaOriginal = datosPorOpcion[opcionOriginal] || []; 
            const existente = indice >= 0 ? listaOriginal[indice] : null; 
            const ahora = new Date().toISOString(); 
 
            const registro = { 
                id: existente?.id || crypto.randomUUID(), 
                codigo: opcionDestino, 
                nombre: $("nombre").value.trim(), 
                producto: $("producto").value.trim(), 
                pais: $("pais").value.trim(), 
                valores: $("valores").value.trim(), 
                que: $("que").value.trim(), 
                como: $("como").value.trim(), 
                dependencias: $("dependencias").value.trim(), 
                cuando: $("cuando").value.trim(), 
                ejemplo: $("ejemplo").value.trim(), 
                notas: $("notas").value.trim(), 
                creadoEn: existente?.creadoEn || ahora, 
                actualizadoEn: ahora 
            }; 
 
            if (!registro.nombre) { 
                mostrarToast("Nombre del Parámetro es obligatorio.", true); 
                return; 
            } 
 
            const duplicado = (datosPorOpcion[opcionDestino] || []).some((otro, otroIndice) => 
                !(opcionDestino === opcionOriginal && otroIndice === indice) && 
                normalizar(otro.nombre) === normalizar(registro.nombre) && 
                normalizar(otro.producto) === normalizar(registro.producto) && 
                normalizar(otro.pais) === normalizar(registro.pais) 
            ); 
 
            if (duplicado && !confirm("Existe un registro similar. ¿Guardar de todas formas?")) { 
                return; 
            } 
 
            datosPorOpcion[opcionDestino] ||= []; 
 
            if (indice >= 0) { 
                listaOriginal.splice(indice, 1); 
                datosPorOpcion[opcionDestino].unshift(registro); 
                registrarCambio("editados"); 
            } else { 
                datosPorOpcion[opcionDestino].unshift(registro); 
                registrarCambio("creados"); 
            } 
 
            cerrarFormulario(); 
            aplicarFiltros(); 
        }); 
 
        function duplicarRegistro(codigo, indice) { 
            const original = datosPorOpcion[codigo]?.[indice]; 
 
            if (!original) { 
                return; 
            } 
 
            const copia = structuredClone(original); 
            copia.id = crypto.randomUUID(); 
            copia.nombre = `${copia.nombre || "Sin nombre"} - Copia`; 
            copia.creadoEn = new Date().toISOString(); 
            copia.actualizadoEn = copia.creadoEn; 
 
            datosPorOpcion[codigo].splice(indice + 1, 0, copia); 
            registrarCambio("creados"); 
            aplicarFiltros(); 
            editarRegistro(codigo, indice + 1); 
        } 
 
        function eliminarRegistro(codigo, indice) { 
            const registro = datosPorOpcion[codigo]?.[indice]; 
 
            if (!registro) { 
                return; 
            } 
 
            if (!confirm(`¿Eliminar ${registro.nombre || "este registro"}?`)) { 
                return; 
            } 
 
            datosPorOpcion[codigo].splice(indice, 1); 
            registrarCambio("eliminados"); 
            aplicarFiltros(); 
        } 
 
        function moverRegistro(codigo, indice, direccion) { 
            const lista = datosPorOpcion[codigo] || []; 
            const destino = indice + direccion; 
 
            if (destino < 0 || destino >= lista.length) { 
                return; 
            } 
 
            [lista[indice], lista[destino]] = [lista[destino], lista[indice]]; 
            registrarCambio("editados"); 
            aplicarFiltros(); 
        } 
 
        function descartarCambios() { 
            if (!confirm("¿Descartar todos los cambios de esta sesión?")) { 
                return; 
            } 
 
            datosPorOpcion = structuredClone(originalesPorOpcion); 
            reiniciarCambios(); 
            aplicarFiltros(); 
        } 
 
        function seleccionarJSON() { 
            $("archivoJSON").value = ""; 
            $("archivoJSON").click(); 
        } 
 
        $("archivoJSON").addEventListener("change", async evento => { 
            const archivo = evento.target.files?.[0]; 
 
            if (!archivo) { 
                return; 
            } 
 
            if (opcionActual === "todas") { 
                mostrarToast("Seleccione una opción específica antes de importar JSON.", true); 
                return; 
            } 
 
            try { 
                const importados = JSON.parse(await archivo.text()); 
 
                if (!Array.isArray(importados)) { 
                    throw new Error("El JSON debe contener una lista de registros."); 
                } 
 
                const modo = prompt("Escriba AGREGAR o REEMPLAZAR.", "AGREGAR"); 
 
                if (!modo) { 
                    return; 
                } 
 
                if (modo.toUpperCase() === "REEMPLAZAR") { 
                    if (!confirm(`Se reemplazarán los registros de Op. ${opcionActual}. ¿Continuar?`)) { 
                        return; 
                    } 
                    cambios.eliminados += (datosPorOpcion[opcionActual] || []).length; 
                    datosPorOpcion[opcionActual] = importados; 
                } else { 
                    datosPorOpcion[opcionActual].push(...importados); 
                } 
 
                cambios.creados += importados.length; 
                actualizarIndicadorCambios(); 
                aplicarFiltros(); 
                mostrarToast(`${importados.length} registro(s) importado(s).`); 
            } catch (error) { 
                mostrarToast(error.message, true); 
            } 
        }); 
 
        function seleccionarExcel() { 
            $("archivoExcel").value = ""; 
            $("archivoExcel").click(); 
        } 
 
        function encontrarFilaEncabezados(filas) { 
            return filas.findIndex(fila => 
                Array.isArray(fila) && 
                fila.some(celda => normalizar(celda).includes("nombre del parametro")) 
            ); 
        } 
 
        function mapaColumnas(encabezados) { 
            const mapa = {}; 
 
            encabezados.forEach((encabezado, indice) => { 
                const limpio = normalizar(encabezado); 
 
                Object.entries(SINONIMOS_EXCEL).forEach(([campo, sinonimos]) => { 
                    if (sinonimos.some(sinonimo => limpio === sinonimo || limpio.includes(sinonimo))) { 
                        mapa[campo] ??= indice; 
                    } 
                }); 
            }); 
 
            return mapa; 
        } 
 
        $("archivoExcel").addEventListener("change", async evento => { 
            const archivo = evento.target.files?.[0]; 
 
            if (!archivo) { 
                return; 
            } 
 
            if (opcionActual === "todas") { 
                mostrarToast("Seleccione una opción específica antes de importar Excel.", true); 
                return; 
            } 
 
            if (typeof XLSX === "undefined") { 
                mostrarToast("No se pudo cargar el lector de Excel. Revise la conexión y vuelva a abrir la página.", true); 
                return; 
            } 
 
            try { 
                const libro = XLSX.read(await archivo.arrayBuffer(), { type: "array" }); 
                const hoja = libro.Sheets[libro.SheetNames[0]]; 
                const filas = XLSX.utils.sheet_to_json(hoja, { header: 1, defval: "", raw: false }); 
                const indiceEncabezados = encontrarFilaEncabezados(filas); 
 
                if (indiceEncabezados < 0) { 
                    throw new Error("No se encontró la fila con Nombre del Parámetro."); 
                } 
 
                const columnas = mapaColumnas(filas[indiceEncabezados]); 
 
                if (columnas.nombre === undefined) { 
                    throw new Error("No se encontró la columna Nombre del Parámetro."); 
                } 
 
                const ahora = new Date().toISOString(); 
                const importados = filas.slice(indiceEncabezados + 1) 
                    .map(fila => ({ 
                        id: crypto.randomUUID(), 
                        codigo: opcionActual, 
                        nombre: String(fila[columnas.nombre] ?? "").trim(), 
                        producto: String(fila[columnas.producto] ?? "").trim(), 
                        pais: String(fila[columnas.pais] ?? "").trim(), 
                        valores: String(fila[columnas.valores] ?? "").trim(), 
                        que: String(fila[columnas.que] ?? "").trim(), 
                        como: String(fila[columnas.como] ?? "").trim(), 
                        dependencias: String(fila[columnas.dependencias] ?? "").trim(), 
                        cuando: String(fila[columnas.cuando] ?? "").trim(), 
                        ejemplo: String(fila[columnas.ejemplo] ?? "").trim(), 
                        notas: String(fila[columnas.notas] ?? "").trim(), 
                        creadoEn: ahora, 
                        actualizadoEn: ahora 
                    })) 
                    .filter(registro => registro.nombre); 
 
                if (!importados.length) { 
                    throw new Error("No se encontraron registros con nombre para importar."); 
                } 
 
                const modo = prompt("Escriba AGREGAR o REEMPLAZAR.", "AGREGAR"); 
 
                if (!modo) { 
                    return; 
                } 
 
                if (modo.toUpperCase() === "REEMPLAZAR") { 
                    if (!confirm(`Se reemplazarán los registros de Op. ${opcionActual}. ¿Continuar?`)) { 
                        return; 
                    } 
                    cambios.eliminados += (datosPorOpcion[opcionActual] || []).length; 
                    datosPorOpcion[opcionActual] = importados; 
                } else { 
                    datosPorOpcion[opcionActual].push(...importados); 
                } 
 
                cambios.creados += importados.length; 
                actualizarIndicadorCambios(); 
                aplicarFiltros(); 
                mostrarToast(`${importados.length} registro(s) importado(s) desde Excel.`); 
            } catch (error) { 
                mostrarToast(error.message, true); 
            } 
        }); 
 
        function descargar(contenido, nombre, tipo) { 
            const url = URL.createObjectURL(new Blob([contenido], { type: tipo })); 
            const enlace = document.createElement("a"); 
            enlace.href = url; 
            enlace.download = nombre; 
            document.body.appendChild(enlace); 
            enlace.click(); 
            enlace.remove(); 
            URL.revokeObjectURL(url); 
        } 
 
        function exportarJSON() { 
            if (opcionActual === "todas") { 
                const paquete = Object.fromEntries( 
                    OPCIONES.map(([codigo]) => [codigo, datosPorOpcion[codigo] || []]) 
                ); 
 
                descargar( 
                    JSON.stringify(paquete, null, 2) + "\n", 
                    `${ambitoActual}_todas_las_opciones.json`, 
                    "application/json;charset=utf-8" 
                ); 
            } else { 
                descargar( 
                    JSON.stringify(datosPorOpcion[opcionActual] || [], null, 2) + "\n", 
                    `${ambitoActual}_op${opcionActual}.json`, 
                    "application/json;charset=utf-8" 
                ); 
            } 
 
            originalesPorOpcion = structuredClone(datosPorOpcion); 
            reiniciarCambios(); 
            mostrarToast("JSON exportado correctamente."); 
        } 
 
        function exportarWord() { 
            const registros = registrosParaVista(); 
 
            if (!registros.length) { 
                mostrarToast("No hay registros visibles para exportar.", true); 
                return; 
            } 
 
            const fichas = registros.map(registro => ` 
                <section class="ficha-word"> 
                    <h2>Op. ${escapar(registro.__opcion)} - ${escapar(registro.nombre || "Sin nombre")}</h2> 
                    <table> 
                        <tr> 
                            <th>PRODUCTO</th> 
                            <th>PAÍS</th> 
                            <th>VALORES PERMITIDOS</th> 
                        </tr> 
                        <tr> 
                            <td>${escapar(registro.producto || "")}</td> 
                            <td>${escapar(registro.pais || "")}</td> 
                            <td>${escapar(registro.valores || "")}</td> 
                        </tr> 
                        <tr> 
                            <th>¿QUÉ HACE?</th> 
                            <th>¿CÓMO FUNCIONA?</th> 
                            <th>DEPENDENCIAS / REGLAS</th> 
                        </tr> 
                        <tr> 
                            <td>${escapar(registro.que || registro.descripcion || "")}</td> 
                            <td>${escapar(registro.como || "")}</td> 
                            <td>${escapar(registro.dependencias || registro.dep || "")}</td> 
                        </tr> 
                        <tr> 
                            <th>¿CUÁNDO APLICA?</th> 
                            <th>EJEMPLO FUNCIONAL</th> 
                            <th>NOTAS VISIBLES AL CLIENTE</th> 
                        </tr> 
                        <tr> 
                            <td>${escapar(registro.cuando || "")}</td> 
                            <td>${escapar(registro.ejemplo || "")}</td> 
                            <td>${escapar(registro.notas || "")}</td> 
                        </tr> 
                    </table> 
                </section> 
            `).join(""); 
 
            const documento = ` 
                <!DOCTYPE html> 
                <html lang="es"> 
                <head> 
                    <meta charset="UTF-8"> 
                    <style> 
                        @page { size: landscape; margin: 1.2cm; } 
                        body { color: #000; font-family: Arial, sans-serif; font-size: 10pt; } 
                        h1, h2 { color: #000; } 
                        h1 { font-size: 18pt; } 
                        h2 { font-size: 14pt; border-bottom: 1px solid #000; padding-bottom: 5px; } 
                        .ficha-word { page-break-inside: avoid; margin-bottom: 18px; } 
                        table { width: 100%; border-collapse: collapse; table-layout: fixed; } 
                        th, td { border: 1px solid #000; padding: 7px; vertical-align: top; } 
                        th { background: #fff; color: #000; font-size: 9pt; text-align: left; } 
                        td { white-space: pre-wrap; } 
                    </style> 
                </head> 
                <body> 
                    <h1>Parámetros del Emisor - ${ambitoActual === "externo" ? "Externo" : "Interno"}</h1> 
                    ${fichas} 
                </body> 
                </html> 
            `; 
 
            descargar( 
                "\ufeff" + documento, 
                `${ambitoActual}_${opcionActual}_parametros.doc`, 
                "application/msword;charset=utf-8" 
            ); 
        } 
 
        $("dependencias").addEventListener("contextmenu", evento => { 
            const textarea = $("dependencias"); 
            const inicio = textarea.selectionStart; 
            const fin = textarea.selectionEnd; 
 
            if (inicio === fin) { 
                return; 
            } 
 
            evento.preventDefault(); 
            seleccionDependencia = { 
                inicio, 
                fin, 
                texto: textarea.value.slice(inicio, fin) 
            }; 
 
            $("buscarDependencia").value = ""; 
            $("emergenteDependencia").hidden = false; 
            filtrarDependencias(); 
            $("buscarDependencia").focus(); 
        }); 
 
        function filtrarDependencias() { 
            const texto = normalizar($("buscarDependencia").value); 
            const resultados = todosLosRegistros() 
                .filter(registro => 
                    !texto || normalizar(`${registro.nombre} ${registro.producto} ${registro.pais}`).includes(texto) 
                ) 
                .slice(0, 100); 
 
            $("listaDependencias").innerHTML = resultados.length 
                ? resultados.map(registro => ` 
                    <button 
                        class="resultado-dependencia" 
                        onclick="vincularDependencia('${escapar(registro.id || "")}', '${escapar(registro.nombre || "Sin nombre")}', '${registro.__opcion}')"> 
                        <strong>Op. ${registro.__opcion} · ${escapar(registro.nombre || "Sin nombre")}</strong><br> 
                        <small>${escapar(registro.producto || "Todos")} · ${escapar(registro.pais || "Todos")}</small> 
                    </button> 
                `).join("") 
                : `<div class="sin-resultados">No se encontraron parámetros.</div>`; 
        } 
 
        $("buscarDependencia").addEventListener("input", filtrarDependencias); 
 
        function vincularDependencia(id, nombre, codigo) { 
            if (!seleccionDependencia) { 
                return; 
            } 
 
            const textarea = $("dependencias"); 
            const idEstable = id || `op${codigo}-${normalizar(nombre).replaceAll(" ", "-")}`; 
            const enlace = `[[${idEstable}|${seleccionDependencia.texto}]]`; 
 
            textarea.value = 
                textarea.value.slice(0, seleccionDependencia.inicio) + 
                enlace + 
                textarea.value.slice(seleccionDependencia.fin); 
 
            cerrarDependencias(); 
        } 
 
        function cerrarDependencias() { 
            $("emergenteDependencia").hidden = true; 
            seleccionDependencia = null; 
        } 
 
        function abrirDependencia(id) { 
            const encontrado = todosLosRegistros().find(registro => 
                registro.id === id || `op${registro.__opcion}-${normalizar(registro.nombre).replaceAll(" ", "-")}` === id 
            ); 
 
            if (!encontrado) { 
                mostrarToast("No se encontró la ficha relacionada.", true); 
                return; 
            } 
 
            opcionActual = encontrado.__opcion; 
            construirMenu(); 
            $("busquedaGeneral").value = encontrado.nombre || ""; 
            aplicarFiltros(); 
            window.scrollTo({ top: 0, behavior: "smooth" }); 
        } 
 
        ["busquedaGeneral", "filtroNombre", "filtroProducto", "filtroPais"].forEach(id => { 
            $(id).addEventListener("input", aplicarFiltros); 
        }); 
 
        window.addEventListener("beforeunload", evento => { 
            if (hayCambios()) { 
                evento.preventDefault(); 
                evento.returnValue = ""; 
            } 
        }); 
 
        document.addEventListener("DOMContentLoaded", async () => { 
            construirMenu(); 
            llenarSelectorOpciones("05"); 
            await cargarTodasLasOpciones(); 
        }); 
    </script> 
</body>

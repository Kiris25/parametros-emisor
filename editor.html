{color:var(--o);font-size:24px;font-weight:300;padding:9px 14px}.card-actions{display:flex;gap:5px;align-items:center;padding:6px}.card-actions .btn{padding:6px 8px;font-size:11px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;padding:11px}.field{min-height:95px;background:#fafafa;border:1px solid #e5e5e5;border-top:4px solid #bbb;padding:9px}.field.imp{background:#fff5ec}.label{font-size:11px;font-weight:850;text-transform:uppercase;color:#444;margin-bottom:7px}.text{white-space:pre-wrap;line-height:1.36}.hit{background:#fff176;color:#000;border-radius:2px;padding:0 1px}.dep-ref-inline{background:#fff0c2;border-bottom:2px solid var(--o);color:#8a3b00;font-weight:800;text-decoration:none}.empty{background:#fff;border:1px dashed var(--br);padding:24px;text-align:center}.modal{position:fixed;inset:0;z-index:100;background:#0009;display:flex;align-items:center;justify-content:center;padding:15px}.modal[hidden]{display:none}.dialog{width:min(920px,100%);max-height:94vh;overflow:auto;background:#fff;border-radius:13px;padding:17px}.dialog-head{display:flex;justify-content:space-between;align-items:center}.dialog-head h2{margin:0;color:var(--o);font-weight:400}.form{display:grid;grid-template-columns:1fr 1fr;gap:11px;margin-top:11px}.form label{font-size:12px;font-weight:800}.full,.form-actions{grid-column:1/-1}.form-actions{display:flex;justify-content:flex-end;gap:8px}.hint{font-size:11px;color:#666}.context-menu,.hover-card{display:none;position:fixed;background:#fff;border:1px solid var(--br);border-radius:12px;box-shadow:0 14px 38px #0004;z-index:140;padding:11px}.context-menu{width:360px;max-width:calc(100vw - 24px)}.ctx-list{max-height:250px;overflow:auto}.ctx-option{display:block;width:100%;text-align:left;border:1px solid #e6e6e6;background:#fafafa;border-radius:8px;padding:8px;margin:6px 0}.hover-card{width:370px;max-width:calc(100vw - 24px);font-size:12px}.hover-card h4{margin:0;color:var(--o);font-size:16px}.hover-actions{display:flex;gap:7px;margin-top:8px}.toast{position:fixed;right:18px;bottom:18px;z-index:160;background:#222;color:#fff;padding:12px 15px;border-radius:9px}.toast.error{background:var(--r)}[hidden]{display:none!important}@media(max-width:1050px){.menu{grid-template-columns:repeat(8,1fr)}.grid{grid-template-columns:1fr 1fr}}@media(max-width:700px){.menu{grid-template-columns:repeat(4,1fr)}.filters,.grid,.form{grid-template-columns:1fr}.full,.form-actions{grid-column:auto}.head{grid-template-columns:90px 1fr}.card-actions{grid-column:1/-1}}

<body> 
<header class="top"><h1>Parámetros del Emisor</h1><div class="actions"><button class="btn orange" onclick="newRecord()">Nuevo registro</button><button class="btn" onclick="pickJSON()">Importar JSON</button><button class="btn" onclick="pickExcel()">Importar Excel</button><button class="btn orange" onclick="exportJSON()">Exportar JSON</button><button class="btn" onclick="exportWord()">Exportar Word B/N</button></div></header> 
<section class="tabs"><button id="ext" class="tab active" onclick="setAudience('externo')">Externo</button><button id="int" class="tab" onclick="setAudience('interno')">Interno</button></section><nav id="menu" class="menu"></nav> 
<section class="filters"><input id="kw" placeholder="Buscar por palabra clave en TODAS las opciones"><input id="fn" placeholder="Filtrar nombre"><input id="fp" placeholder="Filtrar producto"><input id="fc" placeholder="Filtrar país"><button class="btn" onclick="clearFilters()">Limpiar filtros</button></section> 
<div id="status" class="status"></div><h2 id="title" class="title"></h2><main id="content" class="content"></main><input id="jsonFile" type="file" accept=".json" hidden><input id="excelFile" type="file" accept=".xlsx,.xls" hidden> 
<div id="recordModal" class="modal" hidden><section class="dialog"><div class="dialog-head"><h2 id="formTitle">Nuevo registro</h2><button class="btn" onclick="closeForm()">Cerrar</button></div><form id="form" class="form"><input id="editIndex" type="hidden" value="-1"><input id="editSource" type="hidden"><label>Opción<select id="codigo"></select></label><label>Nombre del Parámetro<input id="nombre" required></label><label>Producto<input id="producto"></label><label>País<input id="pais"></label><label class="full">Valores Permitidos<textarea id="valores"></textarea></label><label class="full">¿Qué hace el parámetro?<textarea id="que"></textarea></label><label class="full">¿Cómo funciona?<textarea id="como"></textarea></label><label class="full">Dependencias / Reglas<div id="dependencias" class="text" contenteditable="true"></div><p class="hint">Marque texto y haga clic derecho para convertir la selección en un vínculo.</p></label><label class="full">¿Cuándo aplica?<textarea id="cuando"></textarea></label><label class="full">Ejemplo Funcional<textarea id="ejemplo"></textarea></label><label class="full">Notas Visibles al Cliente<textarea id="notas"></textarea></label><div class="form-actions"><button type="button" class="btn" onclick="closeForm()">Cancelar</button><button class="btn orange">Guardar</button></div></form></section></div> 
<div id="depMenu" class="context-menu"></div><div id="paramHover" class="hover-card" onmouseenter="clearHoverHide()" onmouseleave="hideParamHover()"></div><div id="toast" class="toast" hidden></div> 
<script> 
'use strict'; 
const REPO='parametros-emisor',BRANCH='main';const OPTIONS=[['05','Consultar'],['12','Trabajar con'],['13','Moneda'],['14','Clasificación'],['15','Membresías'],['16','Cargos Auto'],['17','Ciclos'],['18','Tipo Cliente'],['19','Renovación'],['20','Pólizas'],['21','Mensajes'],['22','Sorteos'],['23','Estados'],['24','Clases'],['25','Trasiego'],['26','Cargos I.V.'],['27','Corporativo'],['28','Skip Pay'],['29','Diseño'],['30','Extrafin.'],['31','Limpiar'],['32','Tipo Cta.'],['33','Costos'],['34','Estados Cta.'],['35','Excepciones'],['36','Origen'],['38','No Intereses'],['39','Excep.'],['40','Documentos'],['42','Prepago'],['44','Reducc.'],['45','Vence Pago'],['46','Copia'],['47','Deterioro'],['48','Prospecto'],['49','Renov. Tarj.'],['50','Renov. Emisor'],['52','Rangos'],['53','Tecnología']];const FIELDS=['codigo','nombre','producto','pais','valores','que','como','dependencias','cuando','ejemplo','notas'];const $=id=>document.getElementById(id);let audience='externo',option='05',store={},owner='',token='',saveTimers={},depCtx=null,depSel=null,hoverTimer=null; 
function esc(v){return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}function norm(v){return String(v??'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]+/g,' ').replace(/\s+/g,' ').trim()}function nameOf(c){return OPTIONS.find(x=>x[0]===c)?.[1]||'Sin nombre'}function all(){return OPTIONS.flatMap(([c])=>(store[c]||[]).map(r=>({...r,__option:c})))}function path(c){return`data/${audience}/op${c}.json`}function toast(m,e=false){$('toast').textContent=m;$('toast').className='toast'+(e?' error':'');$('toast').hidden=false;clearTimeout(toast.t);toast.t=setTimeout(()=>$('toast').hidden=true,3500)}function menu(){$('menu').innerHTML=`<button class="op ${option==='all'?'active':''}" onclick="setOption('all')">Todas</button>`+OPTIONS.map(([c,n])=>`<button class="op ${option===c?'active':''}" title="Op. ${c} · ${esc(n)}" onclick="setOption('${c}')">Op. ${c} · ${esc(n)}</button>`).join('')}function selectOptions(c){$('codigo').innerHTML=OPTIONS.map(([x,n])=>`<option value="${x}" ${x===c?'selected':''}>Op. ${x} · ${esc(n)}</option>`).join('')} 
async function ensureAuth(){if(owner&&token)return true;owner=sessionStorage.getItem('peOwner')||prompt('Usuario propietario de GitHub:','')||'';if(!owner)return false;token=prompt('Token de GitHub para guardado automático. No se guardará permanentemente.','')||'';if(!token)return false;sessionStorage.setItem('peOwner',owner);return true}async function readOne(c){try{let r=await fetch(`./${path(c)}?v=${Date.now()}`,{cache:'no-store'});if(r.status===404)return[];if(!r.ok)throw Error(`${path(c)} (${r.status})`);let x=await r.json();return Array.isArray(x)?x:[]}catch(e){console.warn(e);return[]}}async function loadAll(){owner=sessionStorage.getItem('peOwner')||'';$('status').textContent='Cargando todas las opciones...';let pairs=await Promise.all(OPTIONS.map(async([c])=>[c,await readOne(c)]));store=Object.fromEntries(pairs);render();$('status').className='status ok';$('status').textContent=`${audience==='externo'?'Externo':'Interno'} · ${all().length} registros cargados.`}async function setAudience(v){audience=v;$('ext').classList.toggle('active',v==='externo');$('int').classList.toggle('active',v==='interno');await loadAll()}function setOption(v){option=v;menu();render()} 
function searchData(){let q=norm($('kw').value),n=norm($('fn').value),p=norm($('fp').value),c=norm($('fc').value);let base=q||option==='all'?all():(store[option]||[]).map(r=>({...r,__option:option}));return base.filter(r=>(!q||norm(FIELDS.map(k=>htmlText(r[k])).join(' ')).includes(q))&&(!n||norm(r.nombre).includes(n))&&(!p||norm(r.producto).includes(p))&&(!c||norm(r.pais).includes(c)))}function highlight(v){let s=esc(htmlText(v)||'—'),q=String($('kw').value||'').trim();if(!q)return s;let parts=q.split(/\s+/).filter(Boolean).sort((a,b)=>b.length-a.length).map(x=>x.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'));if(!parts.length)return s;return s.replace(new RegExp(`(${parts.join('|')})`,'gi'),'<mark class="hit">$1</mark>')}function htmlText(v){let d=document.createElement('div');d.innerHTML=String(v??'');return d.textContent||''}function field(label,v,cls='',dep=false){return`<div class="field ${cls}"><div class="label">${label}</div><div class="text">${dep?renderDep(v):highlight(v)}</div></div>`}function renderDep(v){let html=String(v||'—');if(!/<a\b/i.test(html))html=esc(html);return html.replace(/<a\s+class="dep-ref-inline"\s+data-target="([^"]+)"[^>]*>(.*?)<\/a>/gi,(_,id,t)=>`<a href="#" class="dep-ref-inline" data-target="${esc(id)}">${highlight(t)}</a>`)}function locate(v){let list=store[v.__option]||[];return list.findIndex(r=>(r.id&&r.id===v.id)||(!r.id&&r.nombre===v.nombre&&r.producto===v.producto&&r.pais===v.pais))}function render(){let a=searchData(),q=norm($('kw').value);$('title').textContent=q?'Resultados en todas las opciones':option==='all'?'Todas las opciones':`Opción ${option} ${nameOf(option)}`;$('content').innerHTML=a.length?a.map(r=>{let i=locate(r),c=r.__option;return`<article class="card"><div class="head"><div class="code">Op. ${c}</div><div class="name">${highlight(r.nombre)}</div><div class="card-actions"><button class="btn" onclick="editRecord('${c}',${i})">Editar</button><button class="btn" onclick="duplicateRecord('${c}',${i})">Duplicar</button><button class="btn red" onclick="removeRecord('${c}',${i})">Eliminar</button></div></div><div class="grid">${field('Producto',r.producto)}${field('País',r.pais)}${field('Valores Permitidos',r.valores)}${field('¿Qué hace?',r.que||r.descripcion)}${field('¿Cómo funciona?',r.como)}${field('Dependencias / Reglas',r.dependencias||r.dep,'',true)}${field('¿Cuándo aplica?',r.cuando)}${field('Ejemplo Funcional',r.ejemplo,'imp')}${field('Notas Visibles al Cliente',r.notas)}</div></article>`}).join(''):'<div class="empty">No hay registros para mostrar.</div>';$('status').textContent=`Mostrando ${a.length} registro(s).`} 
function clearFilters(){['kw','fn','fp','fc'].forEach(id=>$(id).value='');render()}['kw','fn','fp','fc'].forEach(id=>$(id).addEventListener('input',render));function newRecord(){let c=option==='all'?'05':option;$('form').reset();$('editIndex').value=-1;$('editSource').value=c;selectOptions(c);$('dependencias').innerHTML='';$('formTitle').textContent='Nuevo registro';$('recordModal').hidden=false}function editRecord(c,i){let r=store[c]?.[i];if(!r)return;$('form').reset();$('editIndex').value=i;$('editSource').value=c;selectOptions(c);FIELDS.filter(k=>!['codigo','dependencias'].includes(k)).forEach(k=>$(k).value=r[k]??'');$('dependencias').innerHTML=r.dependencias||r.dep||'';$('formTitle').textContent='Editar registro';$('recordModal').hidden=false}function closeForm(){$('recordModal').hidden=true}function key(r,c){return[c,norm(r.nombre),norm(r.producto),norm(r.pais)].join('|')}function exists(r,c,skip=-1){return(store[c]||[]).some((x,i)=>i!==skip&&key(x,c)===key(r,c))} 
$('form').onsubmit=e=>{e.preventDefault();let i=+$('editIndex').value,src=$('editSource').value,dst=$('codigo').value,old=i>=0?store[src][i]:null,now=new Date().toISOString(),r={id:old?.id||crypto.randomUUID(),codigo:dst,nombre:$('nombre').value.trim(),producto:$('producto').value.trim(),pais:$('pais').value.trim(),valores:$('valores').value.trim(),que:$('que').value.trim(),como:$('como').value.trim(),dependencias:$('dependencias').innerHTML.trim(),cuando:$('cuando').value.trim(),ejemplo:$('ejemplo').value.trim(),notas:$('notas').value.trim(),creadoEn:old?.creadoEn||now,actualizadoEn:now};if(!r.nombre)return toast('Nombre es obligatorio.',true);if(exists(r,dst,src===dst?i:-1))return toast('El registro ya existe. No se guardó un duplicado.',true);if(i>=0)store[src].splice(i,1);store[dst]||=[];store[dst].unshift(r);closeForm();render();scheduleSave(src);if(dst!==src)scheduleSave(dst)};function duplicateRecord(c,i){let r=structuredClone(store[c][i]);r.id=crypto.randomUUID();r.nombre=(r.nombre||'Sin nombre')+' - Copia';r.creadoEn=r.actualizadoEn=new Date().toISOString();store[c].splice(i+1,0,r);render();scheduleSave(c);editRecord(c,i+1)}function removeRecord(c,i){if(confirm(`¿Eliminar ${store[c][i].nombre||'este registro'}?`)){store[c].splice(i,1);render();scheduleSave(c)}} 
function scheduleSave(c){clearTimeout(saveTimers[c]);$('status').textContent=`Cambios pendientes en op${c}. Guardando automáticamente...`;saveTimers[c]=setTimeout(()=>saveOption(c),900)}function b64(s){let a=new TextEncoder().encode(s),b='';for(let i=0;i<a.length;i+=32768)b+=String.fromCharCode(...a.subarray(i,i+32768));return btoa(b)}async function saveOption(c){if(!await ensureAuth()){toast('No se pudo autenticar el guardado automático.',true);return}let p=path(c),api=`https://api.github.com/repos/${encodeURIComponent(owner)}/${REPO}/contents/${p}`,h={Accept:'application/vnd.github+json',Authorization:'Bearer '+token,'X-GitHub-Api-Version':'2022-11-28'};try{$('status').textContent=`Guardando ${p}...`;let g=await fetch(api+'?ref='+BRANCH,{headers:h}),sha;if(g.ok)sha=(await g.json()).sha;else if(g.status!==404)throw Error(`Lectura rechazada (${g.status})`);let body={message:`Actualizar ${p} automáticamente`,content:b64(JSON.stringify(store[c],null,2)+'\n'),branch:BRANCH};if(sha)body.sha=sha;let r=await fetch(api,{method:'PUT',headers:{...h,'Content-Type':'application/json'},body:JSON.stringify(body)});if(!r.ok)throw Error(`Guardado rechazado (${r.status}): ${await r.text()}`);$('status').className='status ok';$('status').textContent=`${p} guardado automáticamente.`}catch(e){$('status').className='status error';$('status').textContent=e.message;toast(e.message,true)}} 
function pickJSON(){$('jsonFile').value='';$('jsonFile').click()}function pickExcel(){$('excelFile').value='';$('excelFile').click()}function importUnique(rows,c){store[c]||=[];let existing=new Set(store[c].map(r=>key(r,c))),added=0,dupes=0,ignored=0;for(let r of rows){r={...r,codigo:c,nombre:String(r.nombre||'').trim()};if(!r.nombre){ignored++;continue}let k=key(r,c);if(existing.has(k)){dupes++;continue}r.id=r.id||crypto.randomUUID();r.creadoEn=r.creadoEn||new Date().toISOString();r.actualizadoEn=new Date().toISOString();store[c].push(r);existing.add(k);added++}render();if(added)scheduleSave(c);toast(`${added} nuevos agregados · ${dupes} duplicados omitidos · ${ignored} filas ignoradas.`)}$('jsonFile').onchange=async e=>{if(option==='all')return toast('Seleccione una opción antes de importar.',true);try{let x=JSON.parse(await e.target.files[0].text());if(!Array.isArray(x))throw Error('El JSON debe contener una lista.');importUnique(x,option)}catch(err){toast(err.message,true)}};function headerRow(rows){return rows.findIndex(r=>Array.isArray(r)&&r.some(c=>norm(c).includes('nombre del parametro')))}function colMap(h){let defs={nombre:['nombre del parametro'],producto:['producto'],pais:['pais'],valores:['valores permitidos'],que:['que hace el parametro','que hace'],como:['como funciona'],dependencias:['dependencias reglas','dependencias'],cuando:['cuando aplica'],ejemplo:['ejemplo funcional'],notas:['notas visibles al cliente','notas']},m={};h.forEach((x,i)=>{let n=norm(x);Object.entries(defs).forEach(([k,a])=>{if(m[k]===undefined&&a.some(v=>n===v||n.includes(v)))m[k]=i})});return m}$('excelFile').onchange=async e=>{if(option==='all')return toast('Seleccione una opción antes de importar.',true);try{let wb=XLSX.read(await e.target.files[0].arrayBuffer(),{type:'array'}),rows=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{header:1,defval:'',raw:false}),hi=headerRow(rows);if(hi<0)throw Error('No se encontró Nombre del Parámetro.');let m=colMap(rows[hi]),get=(r,k)=>String(r[m[k]]??'').trim(),items=rows.slice(hi+1).map(r=>({nombre:get(r,'nombre'),producto:get(r,'producto'),pais:get(r,'pais'),valores:get(r,'valores'),que:get(r,'que'),como:get(r,'como'),dependencias:get(r,'dependencias'),cuando:get(r,'cuando'),ejemplo:get(r,'ejemplo'),notas:get(r,'notas')}));importUnique(items,option)}catch(err){toast(err.message,true)}}; 
function download(text,name,type){let u=URL.createObjectURL(new Blob([text],{type})),a=document.createElement('a');a.href=u;a.download=name;a.click();URL.revokeObjectURL(u)}function exportJSON(){let x=option==='all'?Object.fromEntries(OPTIONS.map(([c])=>[c,store[c]||[]])):store[option]||[];download(JSON.stringify(x,null,2)+'\n',`${audience}_${option}.json`,'application/json')}function exportWord(){let a=searchData();if(!a.length)return toast('No hay registros visibles.',true);let cards=a.map(r=>`<h2>Op. ${esc(r.__option)} - ${esc(r.nombre)}</h2><table><tr><th>PRODUCTO</th><th>PAÍS</th><th>VALORES PERMITIDOS</th></tr><tr><td>${esc(r.producto)}</td><td>${esc(r.pais)}</td><td>${esc(r.valores)}</td></tr><tr><th>¿QUÉ HACE?</th><th>¿CÓMO FUNCIONA?</th><th>DEPENDENCIAS / REGLAS</th></tr><tr><td>${esc(r.que)}</td><td>${esc(r.como)}</td><td>${esc(htmlText(r.dependencias))}</td></tr><tr><th>¿CUÁNDO APLICA?</th><th>EJEMPLO FUNCIONAL</th><th>NOTAS VISIBLES AL CLIENTE</th></tr><tr><td>${esc(r.cuando)}</td><td>${esc(r.ejemplo)}</td><td>${esc(r.notas)}</td></tr></table>`).join('');download('\ufeff'+`<!doctype html><html><head><meta charset="utf-8"><style>body{font-family:Arial;color:#000}h2{color:#000;border-bottom:1px solid #000}table{width:100%;border-collapse:collapse;table-layout:fixed;margin-bottom:20px}th,td{border:1px solid #000;padding:7px;vertical-align:top}th{background:#fff;color:#000}</style></head><body><h1>Parámetros del Emisor</h1>${cards}</body></html>`,`${audience}_${option}.doc`,'application/msword')} 
function getOffsets(el){let s=window.getSelection();if(!s||!s.rangeCount||s.isCollapsed)return null;let r=s.getRangeAt(0);if(!el.contains(r.commonAncestorContainer))return null;let pre=r.cloneRange();pre.selectNodeContents(el);pre.setEnd(r.startContainer,r.startOffset);let start=pre.toString().length;return{start,end:start+r.toString().length,text:r.toString()}}function rangeOffsets(el,start,end){let w=document.createTreeWalker(el,NodeFilter.SHOW_TEXT),p=0,n,range=document.createRange(),ss=false,ee=false;while(n=w.nextNode()){let nx=p+n.nodeValue.length;if(!ss&&start<=nx){range.setStart(n,Math.max(0,start-p));ss=true}if(!ee&&end<=nx){range.setEnd(n,Math.max(0,end-p));ee=true;break}p=nx}return ss&&ee?range:null}$('dependencias').oncontextmenu=e=>{e.preventDefault();let off=getOffsets($('dependencias'));if(!off){alert('Primero marque una porción de texto dentro de Dependencias / Reglas y luego haga clic derecho.');return}depSel=off;let m=$('depMenu');m.style.display='block';m.style.left=Math.min(e.clientX,innerWidth-380)+'px';m.style.top=Math.min(e.clientY,innerHeight-360)+'px';m.innerHTML=`<b>Vincular texto seleccionado</b><div>Texto: ${esc(off.text)}</div><input id="depSearch" placeholder="Buscar parámetro u opción..."><div id="depResults" class="ctx-list"></div>`;$('depSearch').oninput=()=>depResults($('depSearch').value);depResults(off.text)};function score(q,r){let ts=norm(q).split(' ').filter(x=>x.length>2),txt=norm(FIELDS.map(k=>htmlText(r[k])).join(' '));return ts.reduce((s,x)=>s+(txt.includes(x)?1:0),0)}function depResults(q){let a=all().map(r=>({r,s:score(q,r)})).filter(x=>x.s>0||!norm(q)).sort((a,b)=>b.s-a.s).slice(0,8);$('depResults').innerHTML=a.length?a.map(x=>`<button class="ctx-option" onclick="addDep('${esc(x.r.id||'')}','${x.r.__option}','${esc(x.r.nombre)}')"><b>Op. ${x.r.__option}</b> · ${esc(x.r.nombre)}<br><small>${esc(x.r.que||x.r.como||'Sin descripción')}</small></button>`).join(''):'Sin coincidencias.'}function addDep(id,c,n){let el=$('dependencias'),r=rangeOffsets(el,depSel.start,depSel.end);if(!r)return toast('Vuelva a marcar el texto.',true);let a=document.createElement('a');a.href='#';a.className='dep-ref-inline';a.dataset.target=id||`op${c}-${norm(n).replaceAll(' ','-')}`;a.appendChild(r.extractContents());r.insertNode(a);hideDep()}function hideDep(){$('depMenu').style.display='none'}document.addEventListener('click',e=>{if(!$('depMenu').contains(e.target))hideDep()});function setupDep(){document.addEventListener('mouseover',e=>{let a=e.target.closest?.('.dep-ref-inline');if(a)showHover(e,a.dataset.target)});document.addEventListener('mouseout',e=>{if(e.target.closest?.('.dep-ref-inline'))hoverTimer=setTimeout(hideParamHover,450)});document.addEventListener('click',e=>{let a=e.target.closest?.('.dep-ref-inline');if(a){e.preventDefault();openTarget(a.dataset.target)}})}function clearHoverHide(){clearTimeout(hoverTimer)}function hideParamHover(){$('paramHover').style.display='none'}function findTarget(id){return all().find(r=>r.id===id||`op${r.__option}-${norm(r.nombre).replaceAll(' ','-')}`===id)}function showHover(e,id){clearHoverHide();let r=findTarget(id);if(!r)return;let h=$('paramHover');h.style.display='block';h.style.left=Math.min(e.clientX+12,innerWidth-390)+'px';h.style.top=Math.min(e.clientY+12,innerHeight-300)+'px';h.innerHTML=`<h4>${esc(r.nombre)}</h4><p>Op. ${r.__option} · ${esc(r.producto||'')} · ${esc(r.pais||'')}</p><p>${esc(r.que||r.como||r.notas||'Sin descripción')}</p><div class="hover-actions"><button class="btn orange" onclick="openTarget('${esc(id)}')">Abrir ficha</button><button class="btn" onclick="removeLink('${esc(id)}')">Quitar vínculo</button></div>`}function openTarget(id){let r=findTarget(id);if(!r)return toast('No se encontró la ficha relacionada.',true);option=r.__option;menu();$('kw').value=r.nombre;render();hideParamHover();closeForm();scrollTo({top:0,behavior:'smooth'})}function removeLink(id){$('dependencias').querySelectorAll(`a.dep-ref-inline[data-target="${CSS.escape(id)}"]`).forEach(a=>a.replaceWith(document.createTextNode(a.textContent)));hideParamHover()}

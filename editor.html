<!doctype html> 
<html lang="es"> 
  <head> 
    <meta charset="utf-8" /> 
    <meta name="viewport" content="width=device-width,initial-scale=1" /> 
    <title>Parámetros Emisor - Editor bilingüe</title> 
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script> 
    <style> 
      :root{--o:#ff6c0c;--g:#4f4f4f;--bg:#f2f2f2;--br:#d9d9d9;--r:#b42318;--ok:#217346}*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:Segoe UI,Arial;color:#333}button,input,textarea,select{font:inherit}button{cursor:pointer}.top{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;padding:11px 20px;background:#fff;border-bottom:1px solid var(--br)}h1{margin:0;color:var(--o);font-size:32px;font-weight:300}.actions,.tabs{display:flex;gap:7px;flex-wrap:wrap;align-items:center}.btn{border:0;border-radius:8px;padding:9px 12px;background:var(--g);color:#fff;font-weight:750}.orange,.active{background:var(--o)!important}.red{background:var(--r)}.tabs{padding:9px 20px;background:#fff;border-bottom:1px solid var(--br)}.tab{border:1px solid #ccc;border-radius:999px;padding:9px 20px;background:#fff;color:var(--g);font-weight:800}.lang{display:flex;overflow:hidden;border:1px solid var(--br);border-radius:999px}.lang button{border:0;padding:8px 12px;background:#fff;color:var(--g);font-weight:800}.menu{display:grid;grid-template-columns:repeat(10,minmax(0,1fr));gap:4px;padding:7px 20px;background:#fafafa}.op{height:26px;border:1px solid #ccc;border-radius:14px;background:#fff;font-size:9.5px;font-weight:750;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.filters{display:grid;grid-template-columns:2fr 1fr 1fr 1fr auto;gap:8px;padding:11px 20px}input,textarea,select,.editable{width:100%;padding:9px;border:1px solid var(--br);border-radius:7px;background:#fff}.status,.title{padding:5px 20px}.status.ok{color:var(--ok)}.status.error{color:var(--r)}.title{margin:0;font-size:24px;font-weight:400}.content{padding:9px 20px 80px}.card{background:#fff;border:1px solid var(--br);margin-bottom:13px}.head{display:grid;grid-template-columns:130px 1fr auto;border-bottom:1px solid var(--br)}.code{background:#595959;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800}.name{padding:10px 14px;color:var(--o);font-size:23px;outline:none}.card-actions{display:flex;gap:5px;align-items:center;padding:6px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;padding:11px}.field{min-height:90px;padding:9px;background:#fafafa;border:1px solid #e5e5e5;border-top:4px solid #bbb}.field.example{background:#fff5ec}.label{font-size:11px;font-weight:850;text-transform:uppercase;margin-bottom:6px}.text{white-space:pre-wrap;line-height:1.35;outline:none}.text:focus,.name:focus{background:#fff;box-shadow:inset 0 0 0 2px #ff6c0c38}.empty{padding:25px;background:#fff;text-align:center}.modal{position:fixed;inset:0;z-index:100;background:#0009;display:flex;align-items:center;justify-content:center;padding:15px}.modal[hidden]{display:none}.dialog{width:min(880px,100%);max-height:94vh;overflow:auto;background:#fff;border-radius:14px;padding:18px}.dialog-head{display:flex;justify-content:space-between}.form{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}.full,.form-actions{grid-column:1/-1}.form-actions{display:flex;justify-content:flex-end;gap:8px}.toast{position:fixed;right:18px;bottom:18px;z-index:150;background:#222;color:#fff;padding:12px;border-radius:8px}.toast.error{background:var(--r)}.questions{position:fixed;right:20px;bottom:20px;z-index:90}.qpanel{position:fixed;right:20px;bottom:75px;z-index:100;width:min(410px,calc(100vw - 24px));max-height:620px;overflow:hidden;background:#fff;border-radius:15px;box-shadow:0 15px 42px #0005}.qpanel[hidden]{display:none}.qhead{display:flex;justify-content:space-between;padding:12px;background:var(--o);color:#fff;cursor:move}.qbody{padding:13px;max-height:550px;overflow:auto}.faq,.recommend{display:block;width:100%;margin:6px 0;padding:9px;text-align:left;border:1px solid var(--br);border-radius:8px;background:#fafafa}.recommend strong{color:var(--o)}mark{background:#fff176}.labels-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.hint{font-size:11px;color:#666}@media(max-width:900px){.menu{grid-template-columns:repeat(6,1fr)}.grid{grid-template-columns:1fr 1fr}@media(max-width:650px){.menu{grid-template-columns:repeat(4,1fr)}.filters,.grid,.form,.labels-grid{grid-template-columns:1fr}.full,.form-actions{grid-column:auto}.head{grid-template-columns:85px 1fr}.card-actions{grid-column:1/-1} 
    </style> 
  </head> 
  <body> 
    <header class="top"> 
      <h1 id="sysTitle">Parámetros del Emisor · Editor</h1> 
      <div class="actions"> 
        <button class="btn orange" onclick="newRecord()">Nuevo registro</button 
        ><button class="btn" onclick="pickExcel()">Importar Excel</button 
        ><button class="btn" onclick="openLabels()"> 
          Etiquetas del sistema</button 
        ><button 
          id="saveBtn" 
          class="btn orange" 
          onclick="saveChanges()" 
          disabled 
        > 
          Guardar cambios 
        </button> 
        <div class="lang"> 
          <button id="esBtn" class="active" onclick="setLanguage('es')"> 
            Español</button 
          ><button id="enBtn" onclick="setLanguage('en')">English</button> 
        </div> 
      </div> 
    </header> 
    <section class="tabs"> 
      <button id="ext" class="tab active" onclick="setAudience('externo')"> 
        Externo</button 
      ><button id="int" class="tab" onclick="setAudience('interno')"> 
        Interno 
      </button> 
    </section> 
    <nav id="menu" class="menu"></nav> 
    <section class="filters"> 
      <input id="search" placeholder="Buscar en todas las opciones" /><input 
        id="fName" 
        placeholder="Nombre" 
      /><input id="fProduct" placeholder="Producto" /><input 
        id="fCountry" 
        placeholder="País" 
      /><button class="btn" onclick="clearFilters()">Limpiar</button> 
    </section> 
    <div id="status" class="status"></div> 
    <h2 id="title" class="title"></h2> 
    <main id="content" class="content"></main> 
    <input id="excel" type="file" accept=".xlsx,.xls" hidden /> 
    <div id="recordModal" class="modal" hidden> 
      <section class="dialog"> 
        <div class="dialog-head"> 
          <h2>Nuevo registro</h2> 
          <button class="btn" onclick="closeModal('recordModal')"> 
            Cerrar 
          </button> 
        </div> 
        <form id="recordForm" class="form"> 
          <label>Opción<select id="code"></select></label 
          ><label>Nombre<input id="nombre" required /></label 
          ><label>Producto<input id="producto" /></label 
          ><label>País<input id="pais" /></label 
          ><label class="full">Valores<textarea id="valores"></textarea></label 
          ><label class="full">Qué hace<textarea id="que"></textarea></label 
          ><label class="full" 
            >Cómo funciona<textarea id="como"></textarea></label 
          ><label class="full" 
            >Dependencias<textarea id="dependencias"></textarea></label 
          ><label class="full" 
            >Cuándo aplica<textarea id="cuando"></textarea></label 
          ><label class="full">Ejemplo<textarea id="ejemplo"></textarea></label 
          ><label class="full">Notas<textarea id="notas"></textarea></label> 
          <div class="form-actions"> 
            <button 
              type="button" 
              class="btn" 
              onclick="closeModal('recordModal')" 
            > 
              Cancelar</button 
            ><button class="btn orange">Agregar</button> 
          </div> 
        </form> 
      </section> 
    </div> 
    <div id="labelsModal" class="modal" hidden> 
      <section class="dialog"> 
        <div class="dialog-head"> 
          <h2>Etiquetas del sistema</h2> 
          <button class="btn" onclick="closeModal('labelsModal')"> 
            Cerrar 
          </button> 
        </div> 
        <p class="hint"> 
          Estas etiquetas se guardan en data/config/labels.json del repositorio 
          del idioma activo y el visor las usa al recargar. 
        </p> 
        <div id="labelsGrid" class="labels-grid"></div> 
        <div class="form-actions"> 
          <button class="btn orange" onclick="applyLabels()"> 
            Guardar etiquetas 
          </button> 
        </div> 
      </section> 
    </div> 
    <div id="toast" class="toast" hidden></div> 
    <script> 
      'use strict'; 
      const $=id=>document.getElementById(id);const OPTIONS=[['05','Consultar'],['12','Trabajar con'],['13','Moneda'],['14','Clasificación'],['15','Membresías'],['16','Cargos Auto'],['17','Ciclos'],['18','Tipo Cliente'],['19','Renovación'],['20','Pólizas'],['21','Mensajes'],['22','Sorteos'],['23','Estados'],['24','Clases'],['25','Trasiego'],['26','Cargos I.V.'],['27','Corporativo'],['28','Skip Pay'],['29','Diseño'],['30','Extrafin.'],['31','Limpiar'],['32','Tipo Cta.'],['33','Costos'],['34','Estados Cta.'],['35','Excepciones'],['36','Origen'],['38','No Intereses'],['39','Excep.'],['40','Documentos'],['42','Prepago'],['44','Reducc.'],['45','Vence Pago'],['46','Copia'],['47','Deterioro'],['48','Prospecto'],['49','Renov. Tarj.'],['50','Renov. Emisor'],['52','Rangos'],['53','Tecnología']];const FIELDS=['nombre','producto','pais','valores','que','como','dependencias','cuando','ejemplo','notas'];let language='es',audience='externo',option='05',data={}; 
      function esc(v){return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}function norm(v){return String(v??'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]+/g,' ').replace(/\s+/g,' ').trim()}function plain(v){let d=document.createElement('div');d.innerHTML=String(v??'');return d.textContent||''}function optName(c){return OPTIONS.find(x=>x[0]===c)?.[1]||''}function all(){return OPTIONS.flatMap(([c])=>(data[c]||[]).map(r=>({...r,__option:c})))}function base(){if(language==='es')return './';if(location.hostname.endsWith('.github.io'))return`https://${location.hostname.split('.')[0]}.github.io/parametros-emisor-en/`;return'../parametros-emisor-en/'}function route(c){return`${base()}data/${audience}/op${c}.json`}async function read(c){try{let r=await fetch(`${route(c)}?v=${Date.now()}`,{cache:'no-store'});if(r.status===404)return[];let x=await r.json();return Array.isArray(x)?x:[]}catch(e){return[]}async function load(){let pairs=await Promise.all(OPTIONS.map(async([c])=>[c,await read(c)]));data=Object.fromEntries(pairs);menu();render()}function menu(){$('menu').innerHTML=`<button class="op ${option==='all'?'active':''}" data-op="all">${language==='es'?'Todas':'All'}</button>`+OPTIONS.map(([c,n])=>`<button class="op ${option===c?'active':''}" data-op="${c}">Op. ${c} · ${esc(n)}</button>`).join('')}$('menu').onclick=e=>{let b=e.target.closest('[data-op]');if(b){option=b.dataset.op;menu();render()};function visible(){let q=norm($('search').value),n=norm($('fName').value),p=norm($('fProduct').value),c=norm($('fCountry').value),baseRows=q||option==='all'?all():(data[option]||[]).map(r=>({...r,__option:option}));return baseRows.filter(r=>(!q||norm(FIELDS.map(k=>plain(r[k])).join(' ')).includes(q))&&(!n||norm(r.nombre).includes(n))&&(!p||norm(r.producto).includes(p))&&(!c||norm(r.pais).includes(c)))}function highlight(v){let s=esc(plain(v)||'—'),q=$('search').value.trim();if(!q)return s;let x=q.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');return s.replace(new RegExp(`(${x})`,'gi'),'<mark>$1</mark>')}['search','fName','fProduct','fCountry'].forEach(id=>$(id).oninput=render);function clearFilters(){['search','fName','fProduct','fCountry'].forEach(id=>$(id).value='');render()} 
      } 
 
      let dirty=new Set(),token=localStorage.getItem('peToken')||'',labels={};function repo(){let owner=location.hostname.endsWith('.github.io')?location.hostname.split('.')[0]:(localStorage.getItem('peOwner')||'');return{owner,name:language==='es'?'parametros-emisor':'parametros-emisor-en',branch:'main'}}function mark(c){dirty.add(c);$('saveBtn').disabled=false;$('status').textContent=`Cambios pendientes: ${[...dirty].map(x=>'op'+x).join(', ')}`;}function field(label,c,i,k,v,cls=''){return`<div class="field ${cls}"><div class="label">${label}</div><div class="text" contenteditable="true" data-c="${c}" data-i="${i}" data-k="${k}">${esc(plain(v))}</div></div>`}function locate(r){return(data[r.__option]||[]).findIndex(x=>(x.id&&x.id===r.id)||x.nombre===r.nombre)}function render(){let a=visible();$('title').textContent=option==='all'?'Todas':`Op. ${option} · ${optName(option)}`;$('content').innerHTML=a.length?a.map(r=>{let c=r.__option,i=locate(r);return`<article class="card"><div class="head"><div class="code">Op. ${c}</div><div class="name" contenteditable="true" data-c="${c}" data-i="${i}" data-k="nombre">${esc(r.nombre)}</div><div class="card-actions"><button class="btn red" data-del="${c}|${i}">Eliminar</button></div></div><div class="grid">${field('Producto',c,i,'producto',r.producto)}${field('País',c,i,'pais',r.pais)}${field('Valores',c,i,'valores',r.valores)}${field('Qué hace',c,i,'que',r.que)}${field('Cómo funciona',c,i,'como',r.como)}${field('Dependencias',c,i,'dependencias',r.dependencias)}${field('Cuándo aplica',c,i,'cuando',r.cuando)}${field('Ejemplo',c,i,'ejemplo',r.ejemplo,'example')}${field('Notas',c,i,'notas',r.notas)}</div></article>`}).join(''):'<div class="empty">Sin registros</div>';$('status').textContent=`${a.length} registro(s)`}$('content').oninput=e=>{let el=e.target.closest('[data-k]');if(!el)return;let r=data[el.dataset.c]?.[+el.dataset.i];if(r){r[el.dataset.k]=el.innerText.trim();mark(el.dataset.c)}};$('content').onclick=e=>{let b=e.target.closest('[data-del]');if(b){let[c,i]=b.dataset.del.split('|');if(confirm('¿Eliminar?')){data[c].splice(+i,1);mark(c);render()}}};function setLanguage(v){language=v;$('esBtn').classList.toggle('active',v==='es');$('enBtn').classList.toggle('active',v==='en');$('sysTitle').textContent=v==='es'?'Parámetros del Emisor · Editor':'Issuer Parameters · Editor';dirty.clear();$('saveBtn').disabled=true;loadLabels().then(load)}function setAudience(v){audience=v;$('ext').classList.toggle('active',v==='externo');$('int').classList.toggle('active',v==='interno');load()}function newRecord(){let c=option==='all'?'05':option;$('recordForm').reset();$('code').innerHTML=OPTIONS.map(([x,n])=>`<option value="${x}" ${x===c?'selected':''}>Op. ${x} · ${n}</option>`).join('');$('recordModal').hidden=false}function closeModal(id){$(id).hidden=true}$('recordForm').onsubmit=e=>{e.preventDefault();let c=$('code').value,r={id:crypto.randomUUID(),codigo:c};FIELDS.forEach(k=>r[k]=$(k)?.value.trim()||'');data[c]||=[];let key=x=>[norm(x.nombre),norm(x.producto),norm(x.pais)].join('|');if(data[c].some(x=>key(x)===key(r)))return alert('Duplicado omitido');data[c].unshift(r);mark(c);closeModal('recordModal');render()};function pickExcel(){if(option==='all')return alert('Seleccione una opción');$('excel').value='';$('excel').click()}$('excel').onchange=async e=>{let wb=XLSX.read(await e.target.files[0].arrayBuffer(),{type:'array'}),rows=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{defval:''}),map=k=>Object.keys(rows[0]||{}).find(h=>norm(h).includes(k));let added=0,keys=new Set((data[option]||[]).map(x=>[norm(x.nombre),norm(x.producto),norm(x.pais)].join('|')));for(let x of rows){let r={id:crypto.randomUUID(),codigo:option,nombre:x[map('nombre del parametro')]||'',producto:x[map('producto')]||'',pais:x[map('pais')]||'',valores:x[map('valores permitidos')]||'',que:x[map('que hace')]||'',como:x[map('como funciona')]||'',dependencias:x[map('dependencias')]||'',cuando:x[map('cuando aplica')]||'',ejemplo:x[map('ejemplo funcional')]||'',notas:x[map('notas visibles')]||''},k=[norm(r.nombre),norm(r.producto),norm(r.pais)].join('|');if(r.nombre&&!keys.has(k)){data[option].push(r);keys.add(k);added++}}if(added)mark(option);render();alert(`${added} nuevos agregados`)}; 
      function auth(){if(!token){token=prompt('Token de GitHub:')||'';if(token)localStorage.setItem('peToken',token)}return token}function headers(){return{Accept:'application/vnd.github+json',Authorization:'Bearer '+token,'X-GitHub-Api-Version':'2022-11-28'}}function b64(s){let a=new TextEncoder().encode(s),b='';for(let i=0;i<a.length;i+=32768)b+=String.fromCharCode(...a.subarray(i,i+32768));return btoa(b)}async function put(path,obj){if(!auth())throw Error('Falta token');let r=repo(),api=`https://api.github.com/repos/${r.owner}/${r.name}/contents/${path}`,g=await fetch(api+'?ref='+r.branch,{headers:headers()}),sha;if(g.ok)sha=(await g.json()).sha;let body={message:'Actualizar '+path,content:b64(JSON.stringify(obj,null,2)+'\n'),branch:r.branch};if(sha)body.sha=sha;let out=await fetch(api,{method:'PUT',headers:{...headers(),'Content-Type':'application/json'},body:JSON.stringify(body)});if(!out.ok)throw Error(await out.text())}async function saveChanges(){if(!dirty.size)return;try{$('saveBtn').disabled=true;for(let c of dirty)await put(`data/${audience}/op${c}.json`,data[c]);dirty.clear();$('status').textContent='Guardado correctamente';}catch(e){$('status').textContent=e.message;$('saveBtn').disabled=false}}const DEFAULT_LABELS={title:'Issuer Parameters',subtitle:'Functional parameter reference',search:'Search across all options',name:'Name',product:'Product',country:'Country',values:'Allowed Values',what:'What does it do?',how:'How does it work?',dependencies:'Dependencies / Rules',when:'When does it apply?',example:'Functional Example',notes:'Customer-visible Notes'};async function loadLabels(){labels={...DEFAULT_LABELS};if(language==='en'){try{let r=await fetch(base()+'data/config/labels.json?v='+Date.now());if(r.ok)labels={...labels,...await r.json()}}catch(e){}}}function openLabels(){if(language!=='en')return alert('Seleccione English para corregir sus etiquetas.');$('labelsGrid').innerHTML=Object.entries(labels).map(([k,v])=>`<label>${k}<input data-label="${k}" value="${esc(v)}"></label>`).join('');$('labelsModal').hidden=false}async function applyLabels(){document.querySelectorAll('[data-label]').forEach(x=>labels[x.dataset.label]=x.value.trim());try{await put('data/config/labels.json',labels);closeModal('labelsModal');alert('Etiquetas publicadas. El visor inglés las leerá al recargar.')}catch(e){alert(e.message)}}document.addEventListener('DOMContentLoaded',async()=>{if(!repo().owner){let o=prompt('Usuario propietario de GitHub:')||'';localStorage.setItem('peOwner',o)}await loadLabels();load()}); 
    </script> 
  </body> 
</html>

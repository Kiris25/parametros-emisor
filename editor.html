<!DOCTYPE html> 
<html lang="es"> 
<head> 
<meta charset="UTF-8"> 
<meta name="viewport" content="width=device-width,initial-scale=1.0"> 
<title>Parámetros Emisor - Editor V4</title> 
<style> 
:root{--o:#ff6c0c;--g:#4f4f4f;--f:#f2f2f2;--b:#d9d9d9;--ok:#217346;--bad:#b42318;--warn:#b26a00}*{box-sizing:border-box}body{margin:0;background:var(--f);font-family:Segoe UI,Arial,sans-serif;color:#333}button,input,textarea,select{font:inherit}.top{background:#fff;padding:16px 22px;border-bottom:1px solid var(--b);display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}h1{margin:0;color:var(--o);font-size:32px;font-weight:300}.actions,.tabs,.tools{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.btn{border:0;border-radius:8px;padding:10px 14px;background:var(--g);color:#fff;font-weight:700;cursor:pointer}.btn.orange,.active{background:var(--o)!important}.btn.green{background:var(--ok)}.btn.red{background:var(--bad)}.btn:disabled{opacity:.45;cursor:not-allowed}.tabs,.tools{padding:10px 22px;background:#fff;border-bottom:1px solid var(--b)}.tab{border:1px solid #ccc;border-radius:999px;background:#fff;color:var(--g);padding:10px 18px;font-weight:800;cursor:pointer}.tab.active{color:#fff}.menu{padding:10px 22px;background:#f8f8f8;display:grid;grid-template-columns:repeat(10,minmax(0,1fr));gap:6px;border-bottom:1px solid var(--b)}.op{height:34px;border:1px solid #ccc;border-radius:18px;background:#fff;color:var(--g);font-size:11px;font-weight:750;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;cursor:pointer}.op.active{background:var(--o);border-color:var(--o);color:#fff}.publish{background:#fff;border-bottom:1px solid var(--b)}.publish summary{padding:11px 22px;cursor:pointer;font-weight:800;color:var(--g)}.config{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;padding:0 22px 14px}.config label,.form label{font-size:12px;font-weight:800;color:var(--g)}input,textarea,select{width:100%;border:1px solid var(--b);border-radius:7px;padding:9px;background:#fff}.filters{padding:12px 22px;display:grid;grid-template-columns:2fr 1fr 1fr 1fr auto;gap:9px}.status{padding:8px 22px;color:#666}.status.ok{color:var(--ok)}.status.error{color:var(--bad)}.status.pending{color:var(--warn);font-weight:800}.option-title{padding:6px 22px 0;font-size:25px;color:var(--g);font-weight:400}.content{padding:10px 22px 70px}.card{background:#fff;border:1px solid var(--b);margin-bottom:14px;box-shadow:0 2px 7px #0001}.head{display:grid;grid-template-columns:150px 1fr auto;border-bottom:1px solid var(--b)}.code{background:#5a5a5a;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;padding:12px}.name{color:var(--o);font-size:25px;font-weight:300;padding:12px 16px}.card-actions{display:flex;gap:6px;align-items:center;padding:8px}.card-actions .btn{padding:7px 9px;font-size:12px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;padding:12px}.field{background:#fafafa;border:1px solid #e6e6e6;border-top:4px solid #bbb;padding:10px;min-height:98px}.field.example{background:#fff5ec}.label{font-size:11px;font-weight:850;color:var(--g);text-transform:uppercase;margin-bottom:7px}.text{white-space:pre-wrap;line-height:1.35}.empty{background:#fff;border:1px dashed var(--b);border-radius:10px;padding:25px;text-align:center;color:#666}.modal{position:fixed;inset:0;background:#0008;z-index:100;display:flex;align-items:center;justify-content:center;padding:18px}.modal[hidden]{display:none}.dialog{width:min(900px,100%);max-height:94vh;overflow:auto;background:#fff;border-radius:14px;padding:20px}.dialog-head{display:flex;justify-content:space-between;align-items:center}.form{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:14px}.full{grid-column:1/-1}.form-actions{grid-column:1/-1;display:flex;justify-content:flex-end;gap:8px}.toast{position:fixed;right:18px;bottom:18px;background:#222;color:#fff;padding:12px 15px;border-radius:9px;z-index:150}.toast.error{background:var(--bad)}[hidden]{display:none!important}@media(max-width:1050px){.menu{grid-template-columns:repeat(5,1fr)}.grid{grid-template-columns:1fr 1fr}.filters{grid-template-columns:1fr 1fr}}@media(max-width:700px){.menu,.grid,.filters,.config,.form{grid-template-columns:1fr}.full,.form-actions{grid-column:auto}.head{grid-template-columns:100px 1fr}.card-actions{grid-column:1/-1}.top,.tabs,.tools,.filters,.content,.status,.option-title{padding-left:12px;padding-right:12px}} 
</style> 
</head> 
<body> 
<header class="top"><div><h1>Parámetros del Emisor</h1><small id="sessionLabel">Editor V4</small></div><div class="actions"><button class="btn" onclick="openForm()">Nuevo</button><button class="btn" onclick="exportJSON()">Exportar JSON</button><button class="btn" onclick="chooseImport()">Importar JSON</button><button id="publishBtn" class="btn green" onclick="publish()" disabled>Guardar en GitHub</button></div></header> 
<section class="tabs"><button id="ext" class="tab active" onclick="setAudience('externo')">Externo</button><button id="int" class="tab" onclick="setAudience('interno')">Interno</button></section> 
<nav id="menu" class="menu"></nav> 
<details class="publish"><summary>Configuración de publicación</summary><div class="config"><label>Propietario de GitHub<input id="owner" placeholder="usuario"></label><label>Repositorio<input id="repo" value="parametros-emisor"></label><label>Rama<input id="branch" value="main"></label></div></details> 
<section class="tools"><button class="btn" onclick="reload()">Recargar</button><button id="discardBtn" class="btn red" onclick="discard()" disabled>Descartar cambios</button><span id="changeLabel">Sin cambios pendientes</span></section> 
<section class="filters"><input id="kw" placeholder="Buscar por palabra clave"><input id="fn" placeholder="Filtrar nombre"><input id="fp" placeholder="Filtrar producto"><input id="fc" placeholder="Filtrar país"><button class="btn" onclick="clearFilters()">Limpiar filtros</button></section> 
<div id="status" class="status"></div><h2 id="optionTitle" class="option-title"></h2><main id="content" class="content"></main><input id="importFile" type="file" accept=".json" hidden> 
<div id="modal" class="modal" hidden><section class="dialog"><div class="dialog-head"><h2 id="formTitle">Nuevo registro</h2><button class="btn" onclick="closeForm()">Cerrar</button></div><form id="form" class="form"><input id="editIndex" type="hidden" value="-1"><input id="editOption" type="hidden"><label>Código<input id="codigo" readonly></label><label>Nombre<input id="nombre" required></label><label>Producto<input id="producto"></label><label>País<input id="pais"></label><label class="full">Valores permitidos<textarea id="valores"></textarea></label><label class="full">¿Qué hace?<textarea id="que"></textarea></label><label class="full">¿Cómo funciona?<textarea id="como"></textarea></label><label class="full">Dependencias / Reglas<textarea id="dependencias"></textarea></label><label class="full">¿Cuándo aplica?<textarea id="cuando"></textarea></label><label class="full">Ejemplo funcional<textarea id="ejemplo"></textarea></label><label class="full">Notas visibles al cliente<textarea id="notas"></textarea></label><div class="form-actions"><button type="button" class="btn" onclick="closeForm()">Cancelar</button><button class="btn orange">Guardar en borrador</button></div></form></section></div><div id="toast" class="toast" hidden></div> 
<script> 
"use strict"; 
const OPTIONS=[['05','Consultar'],['12','Trabajar con'],['13','Moneda'],['14','Clasificación'],['15','Membresías'],['16','Cargos Auto'],['17','Ciclos'],['18','Tipo Cliente'],['19','Renovación'],['20','Pólizas'],['21','Mensajes'],['22','Sorteos'],['23','Estados'],['24','Clases'],['25','Trasiego'],['26','Cargos I.V.'],['27','Corporativo'],['28','Skip Pay'],['29','Diseño'],['30','Extrafin.'],['31','Limpiar'],['32','Tipo Cta.'],['33','Costos'],['34','Estados Cta.'],['35','Excepciones'],['36','Origen'],['38','No Intereses'],['39','Excep.'],['40','Documentos'],['42','Prepago'],['44','Reducc.'],['45','Vence Pago'],['46','Copia'],['47','Deterioro'],['48','Prospecto'],['49','Renov. Tarj.'],['50','Renov. Emisor'],['52','Rangos'],['53','Tecnología']]; 
const FIELDS=['codigo','nombre','producto','pais','valores','que','como','dependencias','cuando','ejemplo','notas'];const $=id=>document.getElementById(id);let audience='externo',option='05',data=[],original=[],dirty={created:0,edited:0,deleted:0}; 
function esc(v){return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}function norm(v){return String(v??'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/\s+/g,' ').trim()}function optionName(code){return OPTIONS.find(x=>x[0]===code)?.[1]||'Sin nombre'}function path(code=option){return`data/${audience}/op${code}.json`}function isDirty(){return dirty.created+dirty.edited+dirty.deleted>0}function toast(message,error=false){$('toast').textContent=message;$('toast').className='toast'+(error?' error':'');$('toast').hidden=false;clearTimeout(toast.t);toast.t=setTimeout(()=>$('toast').hidden=true,3500)}function updateDirty(){let n=dirty.created+dirty.edited+dirty.deleted;$('changeLabel').textContent=n?`Cambios pendientes: ${dirty.created} creados, ${dirty.edited} editados, ${dirty.deleted} eliminados`:'Sin cambios pendientes';$('changeLabel').className=n?'status pending':'';$('publishBtn').disabled=!n||option==='all';$('discardBtn').disabled=!n}function mark(type){dirty[type]++;updateDirty()}function resetDirty(){dirty={created:0,edited:0,deleted:0};updateDirty()}function menu(){$('menu').innerHTML=`<button class="op ${option==='all'?'active':''}" onclick="setOption('all')">Todas</button>`+OPTIONS.map(([c,n])=>`<button class="op ${option===c?'active':''}" title="Op. ${c} · ${esc(n)}" onclick="setOption('${c}')">Op. ${c} · ${esc(n)}</button>`).join('')}function guard(){if(!isDirty())return true;return confirm('Hay cambios sin publicar. ¿Descartarlos y continuar?')}async function setAudience(v){if(!guard())return;audience=v;$('ext').classList.toggle('active',v==='externo');$('int').classList.toggle('active',v==='interno');await reload()}async function setOption(v){if(!guard())return;option=v;menu();await reload()} 
async function getOne(code){let r=await fetch(`./data/${audience}/op${code}.json?v=${Date.now()}`,{cache:'no-store'});if(r.status===404)return[];if(!r.ok)throw Error(`No fue posible leer op${code}.json (${r.status}).`);let x=await r.json();if(!Array.isArray(x))throw Error(`op${code}.json no contiene una lista.`);return x.map(r=>({...r,__option:code}))} 
async function reload(){resetDirty();$('status').className='status';$('status').textContent='Cargando datos...';try{data=option==='all'?(await Promise.all(OPTIONS.map(x=>getOne(x[0])))).flat():await getOne(option);original=structuredClone(data);render();$('status').className='status ok';$('status').textContent=`${audience==='externo'?'Externo':'Interno'} · ${option==='all'?'Todas las opciones':`Op. ${option} · ${optionName(option)}`} · ${data.length} registro(s).`}catch(e){data=[];original=[];render();$('status').className='status error';$('status').textContent=e.message}} 
function filtered(){let q=norm($('kw').value),n=norm($('fn').value),p=norm($('fp').value),c=norm($('fc').value);return data.filter(r=>(!q||norm(FIELDS.map(k=>r[k]).join(' ')).includes(q))&&(!n||norm(r.nombre).includes(n))&&(!p||norm(r.producto).includes(p))&&(!c||norm(r.pais).includes(c)))}function f(label,value,cls=''){return`<div class="field ${cls}"><div class="label">${label}</div><div class="text">${esc(value||'—')}</div></div>`}function render(){let a=filtered();$('optionTitle').textContent=option==='all'?'Todas las opciones':`Opción ${option} ${optionName(option)}`;$('content').innerHTML=a.length?a.map(r=>{let i=data.indexOf(r),code=r.__option||option;return`<article class="card"><div class="head"><div class="code">Op. ${code}</div><div class="name">${esc(r.nombre||'Sin nombre')}</div><div class="card-actions"><button class="btn" onclick="edit(${i})">Editar</button><button class="btn" onclick="duplicate(${i})">Duplicar</button><button class="btn" onclick="move(${i},-1)">↑</button><button class="btn" onclick="move(${i},1)">↓</button><button class="btn red" onclick="removeRecord(${i})">Eliminar</button></div></div><div class="grid">${f('Producto',r.producto)}${f('País',r.pais)}${f('Valores permitidos',r.valores)}${f('¿Qué hace?',r.que||r.descripcion)}${f('¿Cómo funciona?',r.como)}${f('Dependencias / Reglas',r.dependencias||r.dep)}${f('¿Cuándo aplica?',r.cuando)}${f('Ejemplo funcional',r.ejemplo,'example')}${f('Notas visibles al cliente',r.notas)}</div></article>`}).join(''):'<div class="empty">No hay registros para mostrar.</div>'} 
['kw','fn','fp','fc'].forEach(id=>$(id).addEventListener('input',render));function clearFilters(){['kw','fn','fp','fc'].forEach(id=>$(id).value='');render()}function openForm(record=null,index=-1){if(option==='all'&&!record){return toast('Seleccione una opción específica para crear un registro.',true)}$('form').reset();$('editIndex').value=index;let code=record?.__option||option;$('editOption').value=code;$('codigo').value=code;FIELDS.filter(k=>k!=='codigo').forEach(k=>$(k).value=record?.[k]??(k==='dependencias'?record?.dep:'')??'');$('formTitle').textContent=index>=0?'Editar registro':'Nuevo registro';$('modal').hidden=false}function closeForm(){$('modal').hidden=true}function edit(i){openForm(data[i],i)}function duplicate(i){let r=structuredClone(data[i]);r.nombre=(r.nombre||'Sin nombre')+' - Copia';delete r.id;data.splice(i+1,0,r);mark('created');render();openForm(r,i+1)}function removeRecord(i){if(confirm(`¿Eliminar ${data[i].nombre||'este registro'}?`)){data.splice(i,1);mark('deleted');render()}}function move(i,d){let j=i+d;if(j<0||j>=data.length)return;[data[i],data[j]]=[data[j],data[i]];mark('edited');render()} 
$('form').onsubmit=e=>{e.preventDefault();let r={},i=+$('editIndex').value;FIELDS.forEach(k=>r[k]=$(k).value.trim());r.__option=$('editOption').value;if(!r.nombre)return toast('Nombre es obligatorio.',true);let dupe=data.some((x,j)=>j!==i&&x.__option===r.__option&&norm(x.nombre)===norm(r.nombre)&&norm(x.producto)===norm(r.producto)&&norm(x.pais)===norm(r.pais));if(dupe&&!confirm('Existe un registro similar. ¿Guardar de todas formas?'))return;let now=new Date().toISOString();if(i>=0){r.id=data[i].id||crypto.randomUUID();r.creadoEn=data[i].creadoEn||now;r.actualizadoEn=now;data[i]=r;mark('edited')}else{r.id=crypto.randomUUID();r.creadoEn=now;r.actualizadoEn=now;data.unshift(r);mark('created')}closeForm();render()}; 
function exportJSON(){let clean=data.map(({__option,...r})=>r),blob=new Blob([JSON.stringify(clean,null,2)+'\n'],{type:'application/json'}),u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download=`${audience}_${option}_${new Date().toISOString().slice(0,10)}.json`;a.click();URL.revokeObjectURL(u)}function chooseImport(){if(option==='all')return toast('Seleccione una opción específica para importar.',true);$('importFile').value='';$('importFile').click()}$('importFile').onchange=async e=>{try{let x=JSON.parse(await e.target.files[0].text());if(!Array.isArray(x)||!x.every(v=>v&&typeof v==='object'&&!Array.isArray(v)))throw Error('El archivo debe contener una lista de registros.');let mode=prompt('Escriba REEMPLAZAR o AGREGAR.','AGREGAR');if(!mode)return;if(mode.toUpperCase()==='REEMPLAZAR'){if(!confirm(`Se reemplazarán ${data.length} registros por ${x.length}. ¿Continuar?`))return;data=x.map(r=>({...r,__option:option}));dirty={created:x.length,edited:0,deleted:original.length}}else{data.push(...x.map(r=>({...r,__option:option})));dirty.created+=x.length}updateDirty();render();toast(`${x.length} registros importados al borrador.`)}catch(err){toast(err.message,true)}}; 
function backup(){let clean=data.map(({__option,...r})=>r),blob=new Blob([JSON.stringify(clean,null,2)+'\n'],{type:'application/json'}),u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download=`${audience}_op${option}_respaldo_${new Date().toISOString().replace(/[:.]/g,'-')}.json`;a.click();URL.revokeObjectURL(u)}function cfg(){let c={owner:$('owner').value.trim(),repo:$('repo').value.trim(),branch:$('branch').value.trim()||'main'};localStorage.setItem('parametrosEmisorGitHub',JSON.stringify(c));return c}function b64(s){let a=new TextEncoder().encode(s),b='';for(let i=0;i<a.length;i+=32768)b+=String.fromCharCode(...a.subarray(i,i+32768));return btoa(b)}async function publish(){if(option==='all')return toast('Publique desde una opción específica.',true);let c=cfg();if(!c.owner||!c.repo)return toast('Complete propietario y repositorio.',true);if(!confirm(`Se publicará ${path()} con ${data.length} registros. ¿Continuar?`))return;backup();let token=prompt('Pegue el token de GitHub. No se guardará.');if(!token)return;let api=`https://api.github.com/repos/${encodeURIComponent(c.owner)}/${encodeURIComponent(c.repo)}/contents/${path()}`,h={Accept:'application/vnd.github+json',Authorization:'Bearer '+token,'X-GitHub-Api-Version':'2022-11-28'};try{let g=await fetch(api+'?ref='+encodeURIComponent(c.branch),{headers:h}),sha;if(g.ok)sha=(await g.json()).sha;else if(g.status!==404)throw Error(`GitHub rechazó la lectura (${g.status}).`);let clean=data.map(({__option,...r})=>r),body={message:`Actualizar ${path()} desde Editor V4`,content:b64(JSON.stringify(clean,null,2)+'\n'),branch:c.branch};if(sha)body.sha=sha;let r=await fetch(api,{method:'PUT',headers:{...h,'Content-Type':'application/json'},body:JSON.stringify(body)});if(!r.ok)throw Error(`GitHub rechazó el guardado (${r.status}): ${await r.text()}`);original=structuredClone(data);resetDirty();$('status').className='status ok';$('status').textContent=`${path()} guardado correctamente.`;toast('Guardado en GitHub correctamente.')}catch(e){$('status').className='status error';$('status').textContent=e.message;toast(e.message,true)}}function discard(){if(confirm('¿Descartar todos los cambios pendientes?')){data=structuredClone(original);resetDirty();render()}}window.addEventListener('beforeunload',e=>{if(isDirty()){e.preventDefault();e.returnValue=''}});document.addEventListener('DOMContentLoaded',()=>{let c=JSON.parse(localStorage.getItem('parametrosEmisorGitHub')||'{}');$('owner').value=c.owner||'';$('repo').value=c.repo||'parametros-emisor';$('branch').value=c.branch||'main';['owner','repo','branch'].forEach(id=>$(id).addEventListener('change',cfg));menu();reload()}); 
</script> 
</body> 
</html>

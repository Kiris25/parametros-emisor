<!DOCTYPE html> 
<html lang="es"> 
<head> 
<meta charset="UTF-8"> 
<meta name="viewport" content="width=device-width, initial-scale=1.0"> 
<title>Parámetros Emisor - Visor</title> 
<style> 
:root{--naranja:#FF6C0C;--gris:#4F4F4F;--fondo:#F2F2F2;--borde:#D9D9D9} 
*{box-sizing:border-box} 
body{margin:0;background:var(--fondo);font-family:Segoe UI,Arial,sans-serif;color:#333} 
.encabezado{background:white;padding:18px 24px;border-bottom:1px solid var(--borde)} 
h1{margin:0;color:var(--naranja);font-size:34px;font-weight:300} 
.pestanas,.opciones{display:flex;gap:10px;flex-wrap:wrap;background:white;padding:12px 24px;border-bottom:1px solid var(--borde)} 
.opciones{background:#F8F8F8} 
.boton{border:1px solid #C8C8C8;border-radius:999px;padding:10px 18px;background:white;color:var(--gris);font-weight:700;cursor:pointer} 
.boton:hover{border-color:var(--naranja)} 
.boton.activo{background:var(--gris);border-color:var(--gris);color:white} 
.boton-opcion.activo{background:var(--naranja);border-color:var(--naranja);color:white} 
.filtros{padding:14px 24px;background:white;border-bottom:1px solid var(--borde)} 
.busqueda-general{display:grid;grid-template-columns:1fr auto;gap:10px;margin-bottom:10px} 
.filtros-especificos{display:grid;grid-template-columns:repeat(3,1fr);gap:10px} 
.filtros input{width:100%;min-height:42px;border:1px solid var(--borde);border-radius:8px;padding:10px 12px;font:inherit} 
.limpiar{border:0;border-radius:8px;padding:10px 16px;background:var(--gris);color:white;font-weight:700;cursor:pointer} 
.resumen{padding:16px 24px 0;color:#666;font-size:14px} 
.contenido{padding:16px 24px 60px} 
.card{background:white;border:1px solid var(--borde);border-radius:10px;padding:16px;margin-bottom:15px;box-shadow:0 2px 7px rgba(0,0,0,.07)} 
.card h2{margin:0 0 14px;color:var(--naranja);font-weight:400} 
.label{font-weight:700;color:var(--gris)} 
.mensaje{background:white;border:1px solid var(--borde);border-radius:10px;padding:25px;text-align:center;color:#666} 
@media(max-width:760px){.filtros-especificos,.busqueda-general{grid-template-columns:1fr}h1{font-size:27px}.encabezado,.pestanas,.opciones,.filtros,.contenido,.resumen{padding-left:14px;padding-right:14px}} 
</style> 
</head> 
<body> 
<header class="encabezado"><h1>Parámetros Emisor - Visor</h1></header> 
<nav class="pestanas"> 
<button id="btnExterno" class="boton activo" onclick="cambiarAmbito('externo')">Externo</button> 
<button id="btnInterno" class="boton" onclick="cambiarAmbito('interno')">Interno</button> 
</nav> 
<nav class="opciones"> 
<button id="btnOp05" class="boton boton-opcion activo" onclick="cambiarOpcion('op05')">Opción 5</button> 
<button id="btnOp12" class="boton boton-opcion" onclick="cambiarOpcion('op12')">Opción 12</button> 
</nav> 
<section class="filtros"> 
<div class="busqueda-general"> 
<input id="buscador" type="search" placeholder="Buscar en todos los campos" oninput="aplicarFiltros()"> 
<button class="limpiar" onclick="limpiarFiltros()">Limpiar todos los filtros</button> 
</div> 
<div class="filtros-especificos"> 
<input id="fNombre" type="search" placeholder="Filtrar nombre" oninput="aplicarFiltros()"> 
<input id="fProducto" type="search" placeholder="Filtrar producto" oninput="aplicarFiltros()"> 
<input id="fPais" type="search" placeholder="Filtrar país" oninput="aplicarFiltros()"> 
</div> 
</section> 
<div id="resumen" class="resumen"></div> 
<main id="resultado" class="contenido"><div class="mensaje">Cargando datos...</div></main> 
<script> 
let ambitoActual='externo'; 
let opcionActual='op05'; 
let datosActuales=[]; 
function cambiarAmbito(nuevoAmbito){ambitoActual=nuevoAmbito;document.getElementById('btnExterno').classList.toggle('activo',ambitoActual==='externo');document.getElementById('btnInterno').classList.toggle('activo',ambitoActual==='interno');limpiarFiltros(false);cargarDatos()} 
function cambiarOpcion(nuevaOpcion){opcionActual=nuevaOpcion;document.getElementById('btnOp05').classList.toggle('activo',opcionActual==='op05');document.getElementById('btnOp12').classList.toggle('activo',opcionActual==='op12');limpiarFiltros(false);cargarDatos()} 
function escaparHtml(valor){return String(valor??'').replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;').replaceAll("'",'&#039;')} 
function normalizar(valor){return String(valor??'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/\s+/g,' ').trim()} 
function aplicarFiltros(){ 
const general=normalizar(document.getElementById('buscador').value); 
const nombre=normalizar(document.getElementById('fNombre').value); 
const producto=normalizar(document.getElementById('fProducto').value); 
const pais=normalizar(document.getElementById('fPais').value); 
const filtrados=datosActuales.filter(registro=>{ 
  const todo=normalizar([registro.codigo,registro.nombre,registro.producto,registro.pais,registro.descripcion,registro.valores,registro.que,registro.como,registro.dependencias,registro.cuando,registro.ejemplo,registro.notas].join(' ')); 
  return(!general||todo.includes(general))&&(!nombre||normalizar(registro.nombre).includes(nombre))&&(!producto||normalizar(registro.producto).includes(producto))&&(!pais||normalizar(registro.pais).includes(pais)); 
}); 
renderizar(filtrados); 
} 
function limpiarFiltros(renderizarAhora=true){['buscador','fNombre','fProducto','fPais'].forEach(id=>document.getElementById(id).value='');if(renderizarAhora)renderizar(datosActuales)} 
function renderizar(datos){ 
const contenedor=document.getElementById('resultado'); 
const numeroOpcion=opcionActual==='op05'?'5':'12'; 
const nombreAmbito=ambitoActual==='externo'?'Externo':'Interno'; 
document.getElementById('resumen').textContent=nombreAmbito+' · Opción '+numeroOpcion+' · mostrando '+datos.length+' de '+datosActuales.length+(datosActuales.length===1?' registro':' registros'); 
if(!datos.length){contenedor.innerHTML='<div class="mensaje">No se encontraron registros.</div>';return} 
contenedor.innerHTML=''; 
datos.forEach(registro=>{ 
  const tarjeta=document.createElement('article');tarjeta.className='card'; 
  tarjeta.innerHTML=`<h2>${escaparHtml(registro.nombre||'Sin nombre')}</h2><p><span class="label">Código:</span> ${escaparHtml(registro.codigo||numeroOpcion)}</p><p><span class="label">Producto:</span> ${escaparHtml(registro.producto||'')}</p><p><span class="label">País:</span> ${escaparHtml(registro.pais||'')}</p><p><span class="label">Descripción:</span> ${escaparHtml(registro.descripcion||'')}</p>`; 
  contenedor.appendChild(tarjeta); 
}); 
} 
async function cargarDatos(){ 
const contenedor=document.getElementById('resultado');contenedor.innerHTML='<div class="mensaje">Cargando datos...</div>'; 
try{ 
  const ruta='./data/'+ambitoActual+'/'+opcionActual+'.json?v='+Date.now(); 
  const respuesta=await fetch(ruta,{cache:'no-store'}); 
  if(!respuesta.ok)throw new Error('No fue posible leer el archivo: '+respuesta.status); 
  const datos=await respuesta.json(); 
  if(!Array.isArray(datos))throw new Error('El archivo JSON no contiene una lista válida.'); 
  datosActuales=datos; 
  if(!datosActuales.length){const numeroOpcion=opcionActual==='op05'?'5':'12';const nombreAmbito=ambitoActual==='externo'?'Externo':'Interno';document.getElementById('resumen').textContent=nombreAmbito+' · Opción '+numeroOpcion+' · 0 registros';contenedor.innerHTML='<div class="mensaje">No hay registros para esta combinación.</div>';return} 
  aplicarFiltros(); 
}catch(error){datosActuales=[];contenedor.innerHTML='<div class="mensaje">Error leyendo el archivo seleccionado.</div>';console.error(error)} 
} 
cargarDatos(); 
</script> 
</body> 
</html>

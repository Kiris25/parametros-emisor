<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Parámetros Emisor - Visor</title>
 
<style>
body {
    font-family: Segoe UI, Arial, sans-serif;
    margin: 40px;
    background: #f5f5f5;
}
 
h1 {
    color: #FF6C0C;
}
 
button {
    border: 0;
    border-radius: 8px;
    padding: 11px 15px;
    margin-right: 8px;
    background: #4F4F4F;
    color: white;
    font-weight: 700;
    cursor: pointer;
}
 
button:hover {
    background: #FF6C0C;
}
 
.card {
    background: white;
    border: 1px solid #ddd;
    border-radius: 10px;
    padding: 15px;
    margin-bottom: 15px;
}
 
.label {
    font-weight: bold;
    color: #555;
}
</style>
</head>
 
<body>
 
<h1>Parámetros Emisor - Visor</h1>
 
<div>
    <button onclick="cargarArchivo('op05')">Opción 5</button>
    <button onclick="cargarArchivo('op12')">Opción 12</button>
</div>
 
<br>
 
<div id="resultado">
Seleccione una opción.
</div>
 
<script>
async function cargarArchivo(opcion) {
    const contenedor = document.getElementById('resultado');
    contenedor.innerHTML = '<p>Cargando datos...</p>';
 
    try {
        const respuesta = await fetch(
            './data/externo/' + opcion + '.json?v=' + Date.now(),
            { cache: 'no-store' }
        );
 
        if (!respuesta.ok) {
            throw new Error('No fue posible leer el archivo: ' + respuesta.status);
        }
 
        const datos = await respuesta.json();
 
        if (!Array.isArray(datos)) {
            throw new Error('El archivo JSON no contiene una lista válida.');
        }
 
        if (datos.length === 0) {
            contenedor.innerHTML = '<p>No hay registros.</p>';
            return;
        }
 
        contenedor.innerHTML = '';
 
        datos.forEach(registro => {
            const tarjeta = document.createElement('div');
            tarjeta.className = 'card';
 
            tarjeta.innerHTML = `
                <p><span class="label">Nombre:</span> ${registro.nombre || ''}</p>
                <p><span class="label">Producto:</span> ${registro.producto || ''}</p>
                <p><span class="label">País:</span> ${registro.pais || ''}</p>
                <p><span class="label">Descripción:</span> ${registro.descripcion || ''}</p>
            `;
 
            contenedor.appendChild(tarjeta);
        });
    } catch (error) {
        contenedor.innerHTML = '<p>Error leyendo el archivo.</p>';
        console.error(error);
    }
}
 
cargarArchivo('op05');
</script>
 
</body>
</html>
